<script>
// js/core.js
// Uygulama durumu, veri yükleme ve ortak bileşenler
let API = null;
const S = {
  me: null, members: [], employees: [], reports: [], notes: [], tasks: [], checks: [], memberNotes: {},
  urls: {}, gemini: null, backup: null, loadedAt: 0,
};
const isAdmin = () => !!S.me && S.me.role === 'admin';
const memberById = (id) => S.members.find((m) => m.id === id);
const TYPES = {
  gunluk: { label: 'Günlük not', short: 'Günlük' },
  hazir: { label: 'Tamamlanan iş', short: 'Tamamlandı' },
  gelecek_hafta: { label: 'Gelecek hafta planı', short: 'Gelecek hafta' },
};
const NOTE_TYPES = { toplanti: 'Toplantı notu', etkinlik: 'Gelecek hafta etkinliği' };
const PALETTE = ['#3B6CF6', '#D9822B', '#2F8F5B', '#9B51E0', '#D1435B', '#1A9AA0', '#B8860B', '#5B6B82'];
const byOrder = (a, b) => (a.sort_order || 0) - (b.sort_order || 0) || a.name.localeCompare(b.name, 'tr');

async function loadData() {
  const since = (() => { const d = new Date(); d.setMonth(d.getMonth() - 14); return U.iso(d); })();
  const [members, reports, notes, tasks, checks] = await Promise.all([API.members(), API.reports(), API.notes(), API.tasks(), API.checks(since)]);
  S.members = members; S.reports = reports; S.notes = notes; S.tasks = tasks; S.checks = checks;
  const me = members.find((m) => m.id === S.me.id); if (me) S.me = me;
  S.employees = isAdmin() ? members.filter((m) => m.role === 'employee' && m.active).sort(byOrder) : [S.me];
  if (isAdmin()) {
    const [g, b, mn] = await Promise.all([API.getSetting('gemini').catch(() => null), API.getSetting('backup').catch(() => null), API.memberNotes().catch(() => ({}))]);
    S.gemini = g; S.backup = b; S.memberNotes = mn;
  }
  S.loadedAt = Date.now();
}

const reportsOf = (memberId) => S.reports.filter((r) => r.member_id === memberId);
const reportedToday = (memberId) => S.reports.some((r) => r.member_id === memberId && r.date === U.today());

// ---- avatar ----
function avatar(m, size = 32) {
  const { h } = U;
  const style = { width: size + 'px', height: size + 'px', fontSize: Math.round(size * 0.4) + 'px' };
  if (m && m.avatar) return h('img', { class: 'avatar', src: m.avatar, alt: '', style });
  return h('span', { class: 'avatar', style: { ...style, background: (m && m.color) || '#8A93A3' }, 'aria-hidden': 'true' }, U.initials(m && m.name));
}

// ---- görsel adresleri (gizli depodan imzalı bağlantı) ----
async function fillImages(root) {
  const imgs = [...root.querySelectorAll('img[data-path]')];
  const need = [...new Set(imgs.map((i) => i.dataset.path).filter((p) => !S.urls[p]))];
  if (need.length) {
    try { Object.assign(S.urls, await API.imageUrls(need)); } catch (e) { console.warn(e); }
  }
  imgs.forEach((i) => { if (S.urls[i.dataset.path]) i.src = S.urls[i.dataset.path]; else i.classList.add('missing'); });
}

function lightbox(paths, start = 0) {
  const { h } = U;
  let i = start;
  const img = h('img', { class: 'lb-img', alt: '' });
  const count = h('span', { class: 'lb-count' });
  const show = () => { img.src = S.urls[paths[i]] || ''; count.textContent = paths.length > 1 ? (i + 1) + ' / ' + paths.length : ''; };
  const nav = (d) => { i = (i + d + paths.length) % paths.length; show(); };
  const body = h('div', { class: 'lb' },
    paths.length > 1 ? h('button', { class: 'lb-nav prev', 'aria-label': 'Önceki görsel', onclick: () => nav(-1) }, '‹') : null,
    img,
    paths.length > 1 ? h('button', { class: 'lb-nav next', 'aria-label': 'Sonraki görsel', onclick: () => nav(1) }, '›') : null,
  );
  const d = U.dialog('Görsel', body, { wide: true, actions: [count, h('a', { class: 'btn ghost', href: '#', onclick: (e) => { e.preventDefault(); window.open(S.urls[paths[i]], '_blank', 'noopener'); } }, 'Yeni sekmede aç')] });
  d.dlg.classList.add('dlg-lightbox');
  d.dlg.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') nav(-1); if (e.key === 'ArrowRight') nav(1); });
  show();
}

// =====================================================================
// RAPOR YAZMA ALANI (yeni rapor ve düzenleme için ortak)
// =====================================================================
function composer({ memberId, report, onDone, compact }) {
  const { h } = U;
  const editing = !!report;
  const draftKey = 'rd-draft-' + memberId;
  let draft = null;
  if (!editing) { try { draft = JSON.parse(localStorage.getItem(draftKey) || 'null'); } catch { draft = null; } }
  let type = report ? report.type : (draft && draft.type) || 'gunluk';
  const oldImages = report ? [...(report.images || [])] : [];
  let keepImages = [...oldImages];
  const newImages = []; // {blob, url}
  let links = report && report.links && report.links.length ? [...report.links] : (draft && draft.links && draft.links.length ? draft.links : []);

  const saveDraft = () => {
    if (editing) return;
    try {
      const v = { text: ta.value, type, links: links.filter(Boolean) };
      if (v.text || v.links.length) localStorage.setItem(draftKey, JSON.stringify(v)); else localStorage.removeItem(draftKey);
    } catch { /* depolama kapalı */ }
  };

  const typeGroup = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Rapor türü' });
  const renderTypes = () => U.clear(typeGroup, Object.entries(TYPES).map(([k, t]) =>
    h('button', { type: 'button', role: 'radio', 'aria-checked': String(k === type), class: 'seg-item t-' + k + (k === type ? ' on' : ''), onclick: () => { type = k; renderTypes(); saveDraft(); } }, t.label)));
  renderTypes();

  const dateIn = h('input', { type: 'date', class: 'input date', value: report ? report.date : U.today(), max: U.iso(new Date(Date.now() + 86400000 * 60)), 'aria-label': 'Rapor tarihi' });
  const ta = h('textarea', { class: 'input ta', rows: compact ? 3 : 4, placeholder: editing ? '' : 'Bugün neler yaptın? WhatsApp mesajını da buraya yapıştırabilirsin. Ekran görüntüsünü Ctrl+V ile ekleyebilirsin.', 'aria-label': 'Rapor metni' });
  ta.value = report ? report.raw_text || '' : (draft && draft.text) || '';
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 420) + 'px'; };
  ta.addEventListener('input', () => { grow(); saveDraft(); });
  setTimeout(grow, 0);

  const thumbs = h('div', { class: 'thumbs edit' });
  const renderThumbs = () => {
    U.clear(thumbs,
      keepImages.map((p) => h('figure', { class: 'thumb' }, h('img', { 'data-path': p, alt: '' }), h('button', { type: 'button', class: 'thumb-x', 'aria-label': 'Görseli kaldır', onclick: () => { keepImages = keepImages.filter((x) => x !== p); renderThumbs(); } }, '✕'))),
      newImages.map((n, i) => h('figure', { class: 'thumb' }, h('img', { src: n.url, alt: '' }), h('button', { type: 'button', class: 'thumb-x', 'aria-label': 'Görseli kaldır', onclick: () => { URL.revokeObjectURL(n.url); newImages.splice(i, 1); renderThumbs(); } }, '✕'))));
    fillImages(thumbs);
  };
  const addFiles = (files) => {
    [...files].forEach((f) => { if (f && f.type && f.type.startsWith('image/')) newImages.push({ blob: f, url: URL.createObjectURL(f) }); });
    renderThumbs();
  };
  ta.addEventListener('paste', (e) => {
    const items = [...((e.clipboardData && e.clipboardData.items) || [])].filter((i) => i.type.startsWith('image/'));
    if (items.length) { e.preventDefault(); addFiles(items.map((i) => i.getAsFile())); }
  });
  const fileIn = h('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true, onchange: (e) => { addFiles(e.target.files); e.target.value = ''; } });

  const linkBox = h('div', { class: 'links-edit' });
  const renderLinks = () => U.clear(linkBox, links.map((v, i) => h('div', { class: 'link-row' },
    h('input', { class: 'input', type: 'url', inputmode: 'url', placeholder: 'Bağlantı (örn. drive.google.com/...)', value: v, 'aria-label': 'Bağlantı ' + (i + 1), oninput: (e) => { links[i] = e.target.value; saveDraft(); } }),
    h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Bağlantıyı kaldır', onclick: () => { links.splice(i, 1); renderLinks(); saveDraft(); } }, '✕'))));
  renderLinks();

  const msg = h('div', { class: 'form-msg', role: 'status' });
  const saveBtn = U.btn(editing ? 'Değişiklikleri kaydet' : 'Raporu kaydet', { variant: 'primary' });

  async function save() {
    msg.textContent = ''; msg.className = 'form-msg';
    const text = ta.value.trim();
    const cleanLinks = links.map((l) => l.trim()).filter(Boolean).map(U.normalizeUrl);
    const bad = cleanLinks.find((l) => !U.safeUrl(l));
    if (bad) { msg.textContent = 'Bu bağlantı geçerli görünmüyor: ' + bad; msg.classList.add('err'); return; }
    if (!text && !newImages.length && !keepImages.length && !cleanLinks.length) { msg.textContent = 'Kaydetmek için bir şey yaz, görsel ya da bağlantı ekle.'; msg.classList.add('err'); ta.focus(); return; }
    const date = dateIn.value || U.today();
    if (!editing && !newImages.length && !cleanLinks.length && S.reports.some((r) => r.member_id === memberId && r.date === date && U.norm(r.raw_text) === U.norm(text))) {
      msg.textContent = 'Bu mesaj bu tarihle zaten kayıtlı, tekrar eklenmedi.'; msg.classList.add('err'); return;
    }
    await U.busy(saveBtn, async () => {
      try {
        const uploaded = [];
        for (let i = 0; i < newImages.length; i++) {
          saveBtn.textContent = 'Görseller yükleniyor (' + (i + 1) + '/' + newImages.length + ')…';
          const blob = await U.compressImage(newImages[i].blob);
          const path = await API.uploadImage(memberId, blob);
          S.urls[path] = newImages[i].url;
          uploaded.push(path);
        }
        const fields = { date, type, raw_text: text, links: cleanLinks, images: [...keepImages, ...uploaded] };
        let saved;
        if (editing) {
          saved = await API.updateReport(report.id, fields);
          const removed = oldImages.filter((p) => !keepImages.includes(p));
          if (removed.length) API.removeImages(removed).catch(() => {});
          S.reports = S.reports.map((r) => (r.id === saved.id ? saved : r));
          U.toast('Rapor güncellendi.');
        } else {
          saved = await API.addReport({ member_id: memberId, ...fields });
          S.reports.unshift(saved);
          try { localStorage.removeItem(draftKey); } catch { /* */ }
          const who = memberById(memberId);
          U.toast((isAdmin() && who ? who.name + ' için rapor' : 'Rapor') + ' kaydedildi' + (uploaded.length ? ' (' + uploaded.length + ' görsel)' : '') + '.');
        }
        onDone && onDone(saved);
      } catch (e) {
        msg.textContent = e.message; msg.classList.add('err');
      }
    }, 'Kaydediliyor…');
  }
  saveBtn.addEventListener('click', save);
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } });

  const root = h('div', { class: 'composer' + (editing ? ' editing' : '') },
    h('div', { class: 'comp-top' }, typeGroup, h('label', { class: 'date-wrap' }, h('span', { class: 'sr' }, 'Tarih'), dateIn)),
    ta,
    thumbs,
    linkBox,
    h('div', { class: 'comp-foot' },
      h('div', { class: 'comp-tools' },
        U.btn('Görsel ekle', { variant: 'ghost', small: true, onclick: () => fileIn.click() }), fileIn,
        U.btn('Bağlantı ekle', { variant: 'ghost', small: true, onclick: () => { links.push(''); renderLinks(); linkBox.lastChild.querySelector('input').focus(); } }),
      ),
      h('div', { class: 'comp-save' }, editing ? U.btn('Vazgeç', { variant: 'ghost', onclick: () => onDone && onDone(null) }) : h('span', { class: 'hint' }, 'Ctrl+Enter ile kaydet'), saveBtn)),
    msg,
  );
  root.addEventListener('dragover', (e) => { e.preventDefault(); root.classList.add('drop'); });
  root.addEventListener('dragleave', () => root.classList.remove('drop'));
  root.addEventListener('drop', (e) => { e.preventDefault(); root.classList.remove('drop'); addFiles(e.dataTransfer.files); });
  renderThumbs();
  root.focusText = () => ta.focus();
  return root;
}

function editReport(r) {
  const d = U.dialog('Raporu düzenle', composer({ memberId: r.member_id, report: r, onDone: (saved) => { d.close(); if (saved) Router.refresh(); } }), { wide: true });
}

// =====================================================================
// ZAMAN ÇİZGİSİ (günlere göre gruplanmış rapor listesi)
// =====================================================================
function timeline(reports, { showName = true, emptyText = 'Henüz rapor yok.', limit } = {}) {
  const { h } = U;
  const root = h('div', { class: 'timeline' });
  if (!reports.length) { root.appendChild(h('div', { class: 'empty' }, emptyText)); return root; }
  const list = limit ? reports.slice(0, limit) : reports;
  const groups = new Map();
  list.forEach((r) => { if (!groups.has(r.date)) groups.set(r.date, []); groups.get(r.date).push(r); });
  for (const [date, items] of groups) {
    const d = U.parse(date);
    root.appendChild(h('section', { class: 'day' },
      h('header', { class: 'day-head' },
        h('span', { class: 'day-num' }, String(d.getDate())),
        h('span', { class: 'day-meta' }, h('strong', null, U.relDay(date)), h('span', null, U.MONTHS[d.getMonth()] + ' ' + d.getFullYear()))),
      h('div', { class: 'day-items' }, items.map((r) => entry(r, showName)))));
  }
  fillImages(root);
  return root;
}

function entry(r, showName) {
  const { h } = U;
  const m = memberById(r.member_id);
  const text = h('div', { class: 'entry-text' }, U.linkify(r.raw_text || ''));
  const long = (r.raw_text || '').length > 420 || (r.raw_text || '').split('\n').length > 7;
  if (long) text.classList.add('clamp');
  const canEdit = isAdmin() || (S.me && r.member_id === S.me.id);
  const star = isAdmin()
    ? h('button', { class: 'star' + (r.important ? ' on' : ''), 'aria-pressed': String(!!r.important), title: r.important ? 'Önemli işaretini kaldır' : 'Önemli olarak işaretle', 'aria-label': 'Önemli', onclick: async (e) => {
      const b = e.currentTarget; b.disabled = true;
      try { const s = await API.updateReport(r.id, { important: !r.important }); Object.assign(r, s); S.reports = S.reports.map((x) => (x.id === s.id ? s : x)); b.classList.toggle('on', s.important); b.setAttribute('aria-pressed', String(s.important)); b.closest('.entry').classList.toggle('important', s.important); }
      catch (err) { U.toast(err.message, 'err'); } finally { b.disabled = false; }
    } }, '★')
    : (r.important ? h('span', { class: 'star on static', title: 'Yönetici önemli olarak işaretledi' }, '★') : null);
  return h('article', { class: 'entry' + (r.important ? ' important' : ''), style: { '--who': (m && m.color) || '#8A93A3' } },
    h('div', { class: 'entry-head' },
      showName && m ? h('a', { class: 'who', href: '#/calisan/' + m.id }, avatar(m, 22), m.name) : null,
      r.type !== 'gunluk' ? h('span', { class: 'badge t-' + r.type }, TYPES[r.type].short) : null,
      h('span', { class: 'entry-time', title: 'Eklenme: ' + new Date(r.created_at).toLocaleString('tr-TR') }, new Date(r.created_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })),
      h('span', { class: 'grow' }),
      star,
      canEdit ? h('button', { class: 'link-btn', onclick: () => editReport(r) }, 'Düzenle') : null,
      canEdit ? h('button', { class: 'link-btn danger', onclick: async () => {
        if (!(await U.confirm('Rapor silinsin mi?', 'Bu rapor' + ((r.images || []).length ? ' ve görselleri' : '') + ' kalıcı olarak silinecek.'))) return;
        try { await API.deleteReport(r); S.reports = S.reports.filter((x) => x.id !== r.id); U.toast('Rapor silindi.'); Router.refresh(); } catch (e) { U.toast(e.message, 'err'); }
      } }, 'Sil') : null),
    r.raw_text ? text : null,
    long ? h('button', { class: 'link-btn more', onclick: (e) => { const open = text.classList.toggle('clamp'); e.target.textContent = open ? 'Devamını göster' : 'Daha az göster'; } }, 'Devamını göster') : null,
    (r.images || []).length ? h('div', { class: 'thumbs' }, r.images.map((p, i) => h('button', { class: 'thumb', 'aria-label': 'Görseli büyüt', onclick: () => lightbox(r.images, i) }, h('img', { 'data-path': p, alt: '', loading: 'lazy' })))) : null,
    (r.links || []).length ? h('div', { class: 'link-chips' }, r.links.map((u) => { const s = U.safeUrl(u); return s ? h('a', { class: 'chip', href: s, target: '_blank', rel: 'noopener', title: s }, U.hostOf(s)) : null; })) : null,
  );
}

// =====================================================================
// YAPAY ZEKÂ ÇIKTISI (metin + görsel işaretleri + bağlantılar)
// =====================================================================
function aiOutput(text, idToPath, title) {
  const { h } = U;
  const body = h('div', { class: 'ai-text' });
  text.split(/\r?\n/).forEach((line) => {

      U.btn('PDF olarak kaydet', { variant: 'ghost', small: true, onclick: () => Export.printPdf(title, body) })));
}

async function geminiCall(opts) {

<script>
// js/views.js
// Sayfalar ve yönlendirme
const Router = (() => {
  const { h } = U;
  let main = null;
  const routes = {};
  const def = (name, fn) => { routes[name] = fn; };
  function parse() {
    const p = (location.hash.replace(/^#\/?/, '') || '').split('/');
    return { name: p[0] || (isAdmin() ? 'bugun' : 'raporlarim'), arg: p[1] ? decodeURIComponent(p[1]) : null };
  }
  function render() {
    if (!main) return;
    const r = parse();
    const fn = routes[r.name] && (!adminOnly.has(r.name) || isAdmin()) ? routes[r.name] : routes[isAdmin() ? 'bugun' : 'raporlarim'];
    const scrollY = window.__keepScroll ? main.scrollTop : 0;
    U.clear(main);
    try { fn(main, r.arg); } catch (e) { console.error(e); main.appendChild(h('div', { class: 'empty err' }, 'Bu sayfa açılamadı: ' + e.message)); }
    main.scrollTop = scrollY; window.__keepScroll = false;
    Shell.markActive(r);
    document.body.classList.remove('nav-open');
  }
  const adminOnly = new Set(['bugun', 'tum', 'calisan', 'degerlendirme', 'calisanlar']);
  window.addEventListener('hashchange', render);
  return {
    def, render, parse,
    mount(el) { main = el; main.append = (...kids) => U.append(main, kids); render(); },
    unmount() { main = null; },
    refresh() { window.__keepScroll = true; Shell.update(); render(); },
    go(hash) { if (location.hash === hash) render(); else location.hash = hash; },
  };
})();

function pageHead(title, sub, ...actions) {
  const { h } = U;
  return h('header', { class: 'page-head' },
    h('div', null, h('h1', null, title), sub ? h('p', { class: 'sub' }, sub) : null),
    actions.length ? h('div', { class: 'page-actions' }, actions) : null);
}
function section(title, ...kids) {
  const { h } = U;
  return h('section', { class: 'block' }, title ? h('h2', { class: 'block-title' }, title) : null, kids);
}

// ---------------------------------------------------------------------
// YAN MENÜ
// ---------------------------------------------------------------------
const Shell = (() => {
  const { h } = U;
  let nav = null, userBox = null;
  function navItem(hash, label, extra) {
    return h('a', { class: 'nav-item', href: hash, 'data-hash': hash }, h('span', { class: 'nav-label' }, label), extra || null);
  }
  function build(root) {
    nav = h('nav', { class: 'nav', 'aria-label': 'Ana menü' });
    userBox = h('div', { class: 'side-foot' });
    const side = h('aside', { class: 'side' },
      h('div', { class: 'brand' }, h('span', { class: 'brand-mark', 'aria-hidden': 'true' }), h('span', null, 'Rapor Defteri')),
      nav, userBox);
    const main = h('main', { class: 'main', id: 'main', tabindex: '-1' });
    const top = h('div', { class: 'topbar' },
      h('button', { class: 'icon-btn', 'aria-label': 'Menüyü aç', onclick: () => document.body.classList.toggle('nav-open') }, '☰'),
      h('span', { class: 'brand small' }, h('span', { class: 'brand-mark', 'aria-hidden': 'true' }), 'Rapor Defteri'));
    const scrim = h('div', { class: 'scrim', onclick: () => document.body.classList.remove('nav-open') });
    U.clear(root, API.mode === 'demo' ? demoBanner() : null, h('div', { class: 'app' }, side, scrim, h('div', { class: 'main-col' }, top, main)));
    update();
    return main;
  }

  const aOut = h('div', { 'aria-live': 'polite' });
  if (evalState.ask) aOut.appendChild(aiOutput(evalState.ask.text, evalState.ask.idToPath, evalState.ask.title));
  const q = h('textarea', { class: 'input ta', rows: 2, placeholder: 'Örn: Bu hafta kim hangi işi tamamladı?', 'aria-label': 'Soru' });
  const withImg = h('input', { type: 'checkbox', checked: true });
  const quick = ['Bu haftayı özetle', 'Önemli notları özetle', 'Kim hangi işi tamamladı?', 'Gelecek hafta planlarını listele'];
  const askBtn = U.btn('Sor', { variant: 'primary', disabled: noKey, onclick: async () => {
    const question = q.value.trim(); if (!question) { q.focus(); return; }
    U.clear(aOut, h('div', { class: 'thinking' }, 'Raporlar inceleniyor…'));
    await U.busy(askBtn, async () => {
      try {
        const { allData, idToPath, imageParts } = await AI.promptData(S, evalState.askFrom, evalState.askTo, { withImages: withImg.checked });
        if (!Object.keys(allData).length) { U.clear(aOut, h('div', { class: 'notice' }, 'Bu tarih aralığında rapor yok.')); return; }
        let text = 'KAYITLAR:\n' + JSON.stringify(allData) + '\n\nSORU: ' + question;
        if (evalState.askFrom || evalState.askTo) text += '\n\n(Kayıtlar ' + (evalState.askFrom || 'başlangıç') + ' – ' + (evalState.askTo || 'bugün') + ' aralığına göre filtrelendi.)';
        const out = await geminiCall({ system: AI.ASK_SYSTEM, text, images: imageParts });
        evalState.ask = { text: out, idToPath, title: 'Analiz: ' + question };
        U.clear(aOut, aiOutput(out, idToPath, evalState.ask.title));
      } catch (e) { U.clear(aOut, h('div', { class: 'notice err' }, e.message)); }
    }, 'Düşünüyor…');
  } });

  main.append(
    section('Haftalık ekip değerlendirmesi',
      h('p', { class: 'muted' }, 'Seçilen dönemdeki raporları ve ekip notlarını gün gün, kişi kişi bir rapora dönüştürür.'),
      h('div', { class: 'row' }, rangeSeg, custom, wBtn), wOut),
    section('Raporlara soru sor',
      h('div', { class: 'quick' }, quick.map((t) => h('button', { class: 'fchip', onclick: () => { q.value = t; q.focus(); } }, t))),
      q,
      h('div', { class: 'row' },
        h('div', { class: 'range' }, h('span', { class: 'muted' }, 'Tarih aralığı'),
          h('input', { type: 'date', class: 'input', value: evalState.askFrom, 'aria-label': 'Başlangıç', oninput: (e) => { evalState.askFrom = e.target.value; } }), h('span', null, '–'),
          h('input', { type: 'date', class: 'input', value: evalState.askTo, 'aria-label': 'Bitiş', oninput: (e) => { evalState.askTo = e.target.value; } })),
        h('label', { class: 'check' }, withImg, 'Görselleri de incelesin'),
        askBtn),
      aOut),
  );
});

<script>
// js/tasks.js
// Görevler: günlük / haftalık / aylık, tek seferlik ya da tekrarlayan
const Tasks = (() => {
  const { h } = U;
  const PERIODS = {
    gunluk: { label: 'Günlük', every: 'Her gün', one: 'Tek seferlik', head: 'Günlük görevler' },
    haftalik: { label: 'Haftalık', every: 'Her hafta', one: 'Tek seferlik', head: 'Haftalık görevler' },
    aylik: { label: 'Aylık', every: 'Her ay', one: 'Tek seferlik', head: 'Aylık görevler' },
  };

  // Bir tarihin ait olduğu dönemin ilk günü
  function keyOf(period, date) {
    const d = U.parse(date);
    if (period === 'haftalik') { const day = d.getDay(); d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day)); return U.iso(d); }
    if (period === 'aylik') return date.slice(0, 8) + '01';
    return date;
  }
  function shift(period, key, n) {
    const d = U.parse(key);
    if (period === 'haftalik') d.setDate(d.getDate() + 7 * n);
    else if (period === 'aylik') d.setMonth(d.getMonth() + n);
    else d.setDate(d.getDate() + n);
    return U.iso(d);
  }
  function label(period, key) {
    const d = U.parse(key);
    if (period === 'aylik') return U.MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    if (period === 'haftalik') {
      const e = U.parse(shift('gunluk', key, 6));
      return d.getMonth() === e.getMonth() ? d.getDate() + '–' + e.getDate() + ' ' + U.MONTHS[d.getMonth()] : d.getDate() + ' ' + U.MONTHS[d.getMonth()] + ' – ' + e.getDate() + ' ' + U.MONTHS[e.getMonth()];
    }
    return d.getDate() + ' ' + U.MONTHS[d.getMonth()] + ', ' + U.weekday(key);
  }
  function relLabel(period, key) {
    const now = keyOf(period, U.today());
    const names = { gunluk: ['Bugün', 'Dün', 'Yarın'], haftalik: ['Bu hafta', 'Geçen hafta', 'Gelecek hafta'], aylik: ['Bu ay', 'Geçen ay', 'Gelecek ay'] }[period];
    if (key === now) return names[0];
    if (key === shift(period, now, -1)) return names[1];
    if (key === shift(period, now, 1)) return names[2];
    return null;
  }
  const applies = (t, period, key) => t.period === period && (t.recurring
    ? keyOf(period, t.start_date) <= key && (!t.end_date || keyOf(period, t.end_date) >= key)
    : keyOf(period, t.start_date) === key);
  const checkOf = (t, key) => S.checks.find((c) => c.task_id === t.id && c.period_key === key);
  const forMember = (memberId, period, key) => S.tasks.filter((t) => t.member_id === memberId && applies(t, period, key))
    .sort((a, b) => (b.important - a.important) || a.created_at.localeCompare(b.created_at));
  function stats(memberId, period, key) {
    const list = forMember(memberId, period, key);
    return { total: list.length, done: list.filter((t) => checkOf(t, key)).length };
  }
  // Süresi geçmiş, tamamlanmamış tek seferlik görevler (son 60 gün)
  function overdue(memberId) {
    const limit = shift('gunluk', U.today(), -60);
    return S.tasks.filter((t) => t.member_id === memberId && !t.recurring && keyOf(t.period, t.start_date) < keyOf(t.period, U.today())
      && keyOf(t.period, t.start_date) >= keyOf(t.period, limit) && !checkOf(t, keyOf(t.period, t.start_date)));
  }
  const canCheck = (t) => isAdmin() || (S.me && t.member_id === S.me.id);

  async function toggle(t, key, done, note) {
    const c = await API.setCheck(t.id, key, done, note || '');
    S.checks = S.checks.filter((x) => !(x.task_id === t.id && x.period_key === key));
    if (c) S.checks.push(c);
  }

  function noteDialog(t, key, cur) {
    const ta = h('textarea', { class: 'input ta', rows: 3, placeholder: 'Örn: 12 mesaj yanıtlandı, 2 şikâyet iletildi.', 'aria-label': 'Not' });
    ta.value = cur ? cur.note || '' : '';
    const d = U.dialog('Not ekle: ' + t.title, h('div', { class: 'form' }, ta), { actions: [
      U.btn('Vazgeç', { variant: 'ghost', onclick: () => d.close() }),
      U.btn('Kaydet', { variant: 'primary', onclick: async (e) => { await U.busy(e.currentTarget, async () => { try { await toggle(t, key, true, ta.value.trim()); d.close(); U.toast('Not kaydedildi.'); Router.refresh(); } catch (err) { U.toast(err.message, 'err'); } }); } })] });
    setTimeout(() => ta.focus(), 50);
  }

  // Tek görev satırı
  function row(t, key, { showName = false, showPeriod = false } = {}) {
    const m = memberById(t.member_id);
    const c = checkOf(t, key);
    const box = h('button', { class: 'tick' + (c ? ' on' : ''), role: 'checkbox', 'aria-checked': String(!!c), 'aria-label': (c ? 'Tamamlanmadı olarak işaretle: ' : 'Tamamlandı olarak işaretle: ') + t.title, disabled: !canCheck(t), onclick: async () => {
      box.disabled = true;
      try { await toggle(t, key, !c, c ? '' : ''); U.toast(c ? 'İşaret kaldırıldı.' : 'Görev tamamlandı.'); Router.refresh(); }
      catch (e) { U.toast(e.message, 'err'); box.disabled = false; }
    } }, h('span', { 'aria-hidden': 'true' }, '✓'));
    const meta = [];
    if (showName && m) meta.push(h('a', { class: 'who', href: '#/calisan/' + m.id }, avatar(m, 18), m.name));
    meta.push(h('span', { class: 'badge p-' + t.period }, t.recurring ? PERIODS[t.period].every : (showPeriod ? (relLabel(t.period, key) || label(t.period, key)) : PERIODS[t.period].one)));
    if (c) meta.push(h('span', { class: 'done-at' }, new Date(c.done_at).toLocaleString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' tamamlandı'));
    return h('li', { class: 'task' + (c ? ' done' : '') + (t.important ? ' important' : ''), style: { '--who': (m && m.color) || '#8A93A3' } },
      box,
      h('div', { class: 'task-body' },
        h('div', { class: 'task-title' }, t.important ? h('span', { class: 'star on static', title: 'Önemli' }, '★') : null, t.title),
        t.description ? h('div', { class: 'task-desc' }, U.linkify(t.description)) : null,
        c && c.note ? h('div', { class: 'task-note' }, h('strong', null, 'Not: '), c.note) : null,
        h('div', { class: 'task-meta' }, meta)),
      h('div', { class: 'task-actions' },
        c && canCheck(t) ? h('button', { class: 'link-btn', onclick: () => noteDialog(t, key, c) }, c.note ? 'Notu düzenle' : 'Not ekle') : null,
        isAdmin() ? h('button', { class: 'link-btn', onclick: () => taskDialog(t) }, 'Düzenle') : null,
        isAdmin() ? h('button', { class: 'link-btn danger', onclick: async () => {
          const msg = t.recurring ? 'Bu tekrarlayan görev ve geçmiş tüm tamamlama kayıtları silinecek. Sadece bundan sonrasını durdurmak için Düzenle\'den bitiş tarihi verebilirsin.' : 'Bu görev ve tamamlama kaydı silinecek.';
          if (!(await U.confirm('Görev silinsin mi?', msg))) return;
          try { await API.deleteTask(t.id); S.tasks = S.tasks.filter((x) => x.id !== t.id); S.checks = S.checks.filter((x) => x.task_id !== t.id); U.toast('Görev silindi.'); Router.refresh(); } catch (e) { U.toast(e.message, 'err'); }
        } }, 'Sil') : null));
  }

  function progress(done, total) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    return h('span', { class: 'prog', title: done + ' / ' + total + ' tamamlandı' },
      h('span', { class: 'prog-bar' }, h('span', { style: { width: pct + '%' } })), h('span', { class: 'prog-num' }, done + '/' + total));
  }

  // Seçilen tarihe göre günlük, haftalık ve aylık görev listeleri
  function board(memberIds, date, { showName = false, emptyAdd = false, withOverdue = true, presetMember } = {}) {
    const root = h('div', { class: 'task-board' });
    const isToday = date === U.today();
    if (withOverdue && isToday) {
      const od = memberIds.flatMap((id) => overdue(id));
      if (od.length) root.appendChild(h('section', { class: 'task-group overdue' },
        h('header', null, h('h3', null, 'Geciken görevler'), h('span', { class: 'muted small' }, 'Dönemi geçti ama tamamlanmadı')),
        h('ul', { class: 'tasks' }, od.map((t) => row(t, keyOf(t.period, t.start_date), { showName, showPeriod: true })))));
    }
    let any = false;
    for (const period of ['gunluk', 'haftalik', 'aylik']) {
      const key = keyOf(period, date);
      const list = memberIds.flatMap((id) => forMember(id, period, key));
      const done = list.filter((t) => checkOf(t, key)).length;
      if (list.length) any = true;
      root.appendChild(h('section', { class: 'task-group' },
        h('header', null, h('h3', null, PERIODS[period].head), h('span', { class: 'muted small' }, (relLabel(period, key) ? relLabel(period, key) + ', ' : '') + label(period, key)), h('span', { class: 'grow' }), list.length ? progress(done, list.length) : null),
        list.length ? h('ul', { class: 'tasks' }, list.map((t) => row(t, key, { showName }))) : h('p', { class: 'muted small task-empty' }, 'Bu dönem için görev yok.')));
    }
    if (!any && emptyAdd && isAdmin()) root.appendChild(h('div', { class: 'row' }, U.btn('Görev ekle', { variant: 'primary', onclick: () => taskDialog(null, presetMember) })));
    return root;
  }

  // ---- görev ekle / düzenle ----
  function taskDialog(t, presetMember) {
    const editing = !!t;
    const f = t ? { ...t } : { title: '', description: '', period: 'gunluk', recurring: false, start_date: U.today(), end_date: null, important: false };
    const title = h('input', { class: 'input', id: 't-title', value: f.title, placeholder: 'Örn: Sosyal medya hesaplarını kontrol et', autocomplete: 'off' });
    const desc = h('textarea', { class: 'input ta', id: 't-desc', rows: 3, placeholder: 'İsteğe bağlı: ayrıntılar, bağlantılar' }); desc.value = f.description || '';
    const emps = S.employees;
    const selected = new Set(t ? [t.member_id] : presetMember ? [presetMember] : []);
    const people = h('div', { class: 'pick' });
    const renderPeople = () => U.clear(people,
      !editing && emps.length > 1 ? h('label', { class: 'pick-item all' }, h('input', { type: 'checkbox', checked: emps.every((e) => selected.has(e.id)), onchange: (e) => { emps.forEach((x) => (e.target.checked ? selected.add(x.id) : selected.delete(x.id))); renderPeople(); } }), h('strong', null, 'Tüm ekip')) : null,
      emps.map((e) => h('label', { class: 'pick-item' }, h('input', { type: editing ? 'radio' : 'checkbox', name: 't-person', checked: selected.has(e.id), onchange: (ev) => { if (editing) selected.clear(); ev.target.checked ? selected.add(e.id) : selected.delete(e.id); if (!editing) renderPeople(); } }), avatar(e, 22), e.name)));
    renderPeople();

    const periodSeg = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Dönem' });
    const kindSeg = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Tekrar' });
    const whenBox = h('div', { class: 'field' });
    let dateIn, endIn;
    const renderWhen = () => {
      U.clear(periodSeg, Object.entries(PERIODS).map(([k, p]) => h('button', { type: 'button', role: 'radio', 'aria-checked': String(f.period === k), class: 'seg-item' + (f.period === k ? ' on' : ''), onclick: () => { f.period = k; renderWhen(); } }, p.label)));
      U.clear(kindSeg, [[false, 'Tek seferlik'], [true, 'Tekrarlayan']].map(([v, l]) => h('button', { type: 'button', role: 'radio', 'aria-checked': String(f.recurring === v), class: 'seg-item' + (f.recurring === v ? ' on' : ''), onclick: () => { f.recurring = v; renderWhen(); } }, l)));
      const isMonth = f.period === 'aylik';
      dateIn = h('input', { class: 'input date', id: 't-date', type: isMonth ? 'month' : 'date', value: isMonth ? f.start_date.slice(0, 7) : f.start_date, oninput: (e) => { f.start_date = isMonth ? e.target.value + '-01' : e.target.value; hint.textContent = hintText(); } });
      endIn = h('input', { class: 'input date', id: 't-end', type: isMonth ? 'month' : 'date', value: f.end_date ? (isMonth ? f.end_date.slice(0, 7) : f.end_date) : '', oninput: (e) => { f.end_date = e.target.value ? (isMonth ? e.target.value + '-01' : e.target.value) : null; } });
      const hint = h('small', null, hintText());
      U.clear(whenBox,
        h('label', { for: 't-date' }, f.recurring ? 'Başlangıç' : ({ gunluk: 'Hangi gün', haftalik: 'Hangi hafta (haftadan herhangi bir gün)', aylik: 'Hangi ay' })[f.period]),
        h('div', { class: 'row' }, dateIn, f.recurring ? h('span', { class: 'muted' }, 'bitiş') : null, f.recurring ? endIn : null, f.recurring ? h('span', { class: 'muted small' }, '(boş bırakılırsa süresiz)') : null),
        hint);
    };
    function hintText() {
      if (!f.start_date) return '';
      const key = keyOf(f.period, f.start_date);
      return f.recurring ? PERIODS[f.period].every + ' yeniden açılır, ilk dönem: ' + label(f.period, key) + '.' : 'Dönem: ' + label(f.period, key) + '.';
    }
    renderWhen();
    const imp = h('input', { type: 'checkbox', checked: f.important });
    const msg = h('div', { class: 'form-msg' });
    const saveBtn = U.btn(editing ? 'Kaydet' : 'Görevi ekle', { variant: 'primary', type: 'submit' });
    const form = h('form', { class: 'form', onsubmit: async (e) => {
      e.preventDefault(); msg.textContent = ''; msg.className = 'form-msg';
      const err = (m) => { msg.textContent = m; msg.className = 'form-msg err'; };
      if (!title.value.trim()) return err('Görev başlığını yaz.');
      if (!selected.size) return err('Görevin kime verileceğini seç.');
      if (!f.start_date) return err('Tarih seç.');
      if (f.recurring && f.end_date && f.end_date < f.start_date) return err('Bitiş, başlangıçtan önce olamaz.');
      const base = { title: title.value.trim(), description: desc.value.trim(), period: f.period, recurring: f.recurring,
        start_date: f.recurring ? f.start_date : keyOf(f.period, f.start_date), end_date: f.recurring ? f.end_date : null, important: imp.checked };
      await U.busy(saveBtn, async () => {
        try {
          if (editing) {
            const s = await API.updateTask(t.id, { ...base, member_id: [...selected][0] });
            S.tasks = S.tasks.map((x) => (x.id === s.id ? s : x));
            U.toast('Görev güncellendi.');
          } else {
            const rows = await API.addTasks([...selected].map((id) => ({ ...base, member_id: id })));
            S.tasks.push(...rows);
            U.toast(rows.length > 1 ? rows.length + ' kişiye görev verildi.' : 'Görev eklendi.');
          }
          d.close(); Router.refresh();
        } catch (ex) { err(ex.message); }
      }, 'Kaydediliyor…');
    } },
      h('div', { class: 'field' }, h('label', { for: 't-title' }, 'Görev'), title),
      h('div', { class: 'field' }, h('label', { for: 't-desc' }, 'Açıklama'), desc),
      h('div', { class: 'field' }, h('span', { class: 'label' }, editing ? 'Kişi' : 'Kime'), emps.length ? people : h('p', { class: 'muted' }, 'Önce Çalışanlar sayfasından çalışan ekle.')),
      h('div', { class: 'form two' }, h('div', { class: 'field' }, h('span', { class: 'label' }, 'Dönem'), periodSeg), h('div', { class: 'field' }, h('span', { class: 'label' }, 'Tekrar'), kindSeg)),
      whenBox,
      h('label', { class: 'check' }, imp, '★ Önemli görev'),
      msg,
      h('div', { class: 'dlg-foot inline' }, U.btn('Vazgeç', { variant: 'ghost', onclick: () => d.close() }), saveBtn));
    const d = U.dialog(editing ? 'Görevi düzenle' : 'Görev ver', form, { wide: true });
    setTimeout(() => title.focus(), 50);
  }

  // ---- sayfa ----
  const pageState = { date: null, member: '' };
  function page(main) {
    const admin = isAdmin();
    const date = pageState.date || U.today();
    const nav = h('div', { class: 'date-nav' },
      h('button', { class: 'icon-btn', 'aria-label': 'Önceki gün', onclick: () => { pageState.date = shift('gunluk', date, -1); Router.render(); } }, '‹'),
      h('input', { type: 'date', class: 'input date', value: date, 'aria-label': 'Tarih', onchange: (e) => { pageState.date = e.target.value || U.today(); Router.render(); } }),
      h('button', { class: 'icon-btn', 'aria-label': 'Sonraki gün', onclick: () => { pageState.date = shift('gunluk', date, 1); Router.render(); } }, '›'),
      date !== U.today() ? U.btn('Bugüne dön', { variant: 'ghost', small: true, onclick: () => { pageState.date = null; Router.render(); } }) : null);
    let ids = admin ? S.employees.map((e) => e.id) : [S.me.id];
    let filter = null;
    if (admin) {
      filter = h('select', { class: 'input', 'aria-label': 'Çalışan', onchange: (e) => { pageState.member = e.target.value; Router.render(); } },
        h('option', { value: '' }, 'Tüm çalışanlar'), S.employees.map((e) => h('option', { value: e.id }, e.name)));
      filter.value = pageState.member;
      if (pageState.member && S.employees.some((e) => e.id === pageState.member)) ids = [pageState.member];
    }
    main.append(
      pageHead(admin ? 'Görevler' : 'Görevlerim', admin ? 'Günlük, haftalık ve aylık görevler. Çalışanlar kendi görevlerini görüp tamamlandı olarak işaretler.' : 'Yöneticinin verdiği görevler. Bitirdiğinde kutuyu işaretle, istersen not ekle.',
        admin ? U.btn('Görev ver', { variant: 'primary', onclick: () => taskDialog(null, pageState.member || null) }) : null),
      h('div', { class: 'filter-bar' }, nav, filter),
      board(ids, date, { showName: admin && ids.length > 1, emptyAdd: true, presetMember: pageState.member || null }));
  }
  Router.def('gorevler', page);
  const open = (memberId) => { pageState.member = memberId || ''; pageState.date = null; Router.go('#/gorevler'); };

  return { open, PERIODS, keyOf, shift, label, applies, checkOf, forMember, stats, overdue, row, board, progress, taskDialog };
})();

<script>
// js/settings.js
// Ayarlar: ekip, yapay zekâ, yedekleme, görünüm, hesap
const Theme = (() => {
  const KEY = 'rd-theme';
  const get = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  function apply(t = get()) {
    const mode = t.mode || 'light';
    const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (t.accent) document.documentElement.style.setProperty('--accent', t.accent); else document.documentElement.style.removeProperty('--accent');
  }
  function set(patch) { const t = { ...get(), ...patch }; try { localStorage.setItem(KEY, JSON.stringify(t)); } catch { /* */ } apply(t); }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => apply());
  return { get, apply, set };
})();

function appLink() {
  const cfg = (window.RD_CONFIG && window.RD_CONFIG.appUrl) || '';
  if (cfg) return cfg;
  return /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname) ? location.origin + location.pathname : '';
}

function inviteText(m) {
  const link = appLink();
  return 'Merhaba ' + m.name.split(' ')[0] + ', rapor defterine erişimin açıldı.\n\n'
    + '1. ' + (link || '[uygulama bağlantısı]') + ' adresini aç.\n'
    + '2. "Hesap oluştur"a tıkla ve ' + m.email + ' adresiyle kendi şifreni belirle.\n'
    + '3. Görevlerini oradan görüp işaretleyebilir, günlük raporlarını yazabilirsin. Telefonda tarayıcı menüsünden "Ana ekrana ekle" dersen uygulama gibi açılır.';
}

function inviteDialog(m) {
  const { h } = U;
  const text = inviteText(m);
  const pre = h('pre', { class: 'invite' }, text);
  const d = U.dialog(m.name + ' için davet', h('div', null,
    h('p', null, 'Bu mesajı WhatsApp ya da e-postayla gönder. ' + m.name.split(' ')[0] + ' bağlantıyı açıp kendi şifresini belirleyecek.'),
    pre,
    appLink() ? null : h('p', { class: 'muted' }, 'Uygulama adresi ayarlanmamış. config.js dosyasındaki appUrl satırına sitenin adresini yaz.')), {
    actions: [U.btn('Kapat', { variant: 'ghost', onclick: () => d.close() }),
      U.btn('Mesajı kopyala', { variant: 'primary', onclick: async () => { try { await navigator.clipboard.writeText(text); U.toast('Davet mesajı kopyalandı.'); } catch { U.toast('Kopyalanamadı. Metni seçip Ctrl+C ile kopyala.', 'err'); } } })],
    onClose: () => Router.refresh(),
  });
}

function passwordDialog(title = 'Şifreni değiştir') {
  const { h } = U;
  const p1 = h('input', { class: 'input', type: 'password', autocomplete: 'new-password', id: 'pw1', minlength: 6, required: true });
  const p2 = h('input', { class: 'input', type: 'password', autocomplete: 'new-password', id: 'pw2', required: true });
  const msg = h('div', { class: 'form-msg' });
  const b = U.btn('Şifreyi kaydet', { variant: 'primary', type: 'submit' });
  const d = U.dialog(title, h('form', { class: 'form', onsubmit: async (e) => {
    e.preventDefault();
    if (p1.value.length < 6) { msg.textContent = 'Şifre en az 6 karakter olmalı.'; msg.className = 'form-msg err'; return; }
    if (p1.value !== p2.value) { msg.textContent = 'Şifreler aynı değil.'; msg.className = 'form-msg err'; return; }
    await U.busy(b, async () => {
      try { await API.updatePassword(p1.value); d.close(); U.toast('Şifren değiştirildi.'); } catch (err) { msg.textContent = err.message; msg.className = 'form-msg err'; }
    });
  } },
    h('div', { class: 'field' }, h('label', { for: 'pw1' }, 'Yeni şifre'), p1, h('small', null, 'En az 6 karakter.')),
    h('div', { class: 'field' }, h('label', { for: 'pw2' }, 'Yeni şifre (tekrar)'), p2),
    msg, h('div', { class: 'dlg-foot inline' }, U.btn('Vazgeç', { variant: 'ghost', onclick: () => d.close() }), b)));
}

Router.def('ayarlar', (main) => {
  const { h } = U;
  main.append(pageHead('Ayarlar'));

  if (isAdmin()) {
    main.append(section('Ekip', h('p', { class: 'muted' }, 'Çalışan ekleme, düzenleme, sıralama, şifre sıfırlama ve silme işlemleri Çalışanlar sayfasında.'), h('a', { class: 'btn ghost', href: '#/calisanlar' }, 'Çalışanlar sayfasını aç')));

    // ---- yapay zekâ ----
    const g = S.gemini || {};
    const key = h('input', { class: 'input', type: 'password', id: 'g-key', value: g.apiKey || '', placeholder: 'AIza…', autocomplete: 'off' });
    const model = h('input', { class: 'input', id: 'g-model', value: g.model || AI.DEFAULT_MODEL, autocomplete: 'off' });
    const gmsg = h('div', { class: 'form-msg' });
    const saveG = async () => { const v = { apiKey: key.value.trim(), model: model.value.trim() || AI.DEFAULT_MODEL }; await API.setSetting('gemini', v); S.gemini = v; };
    main.append(section('Yapay zekâ',
      h('p', { class: 'muted' }, 'Değerlendirme, analiz ve asistan Google Gemini ile çalışır. Anahtar ücretsizdir: aistudio.google.com/apikey adresinde Google hesabınla giriş yapıp "Create API key" de. Anahtarı yalnızca yöneticiler görebilir.'),
      h('div', { class: 'form two' },
        h('div', { class: 'field' }, h('label', { for: 'g-key' }, 'Gemini API anahtarı'), key),
        h('div', { class: 'field' }, h('label', { for: 'g-model' }, 'Model'), model, h('small', null, 'Çoğu zaman değiştirmen gerekmez. "' + AI.DEFAULT_MODEL + '" her zaman güncel modeli kullanır.'))),
      gmsg,
      h('div', { class: 'row' },
        U.btn('Kaydet', { variant: 'primary', onclick: async (e) => { await U.busy(e.currentTarget, async () => { try { await saveG(); gmsg.textContent = 'Kaydedildi.'; gmsg.className = 'form-msg ok'; } catch (err) { gmsg.textContent = err.message; gmsg.className = 'form-msg err'; } }); } }),
        U.btn('Bağlantıyı dene', { variant: 'ghost', onclick: async (e) => { await U.busy(e.currentTarget, async () => { try { await saveG(); const t = await geminiCall({ system: 'Kısa cevap ver.', text: 'Sadece "Bağlantı çalışıyor" yaz.', maxTokens: 2000 }); gmsg.textContent = 'Gemini yanıt verdi: ' + t.slice(0, 80); gmsg.className = 'form-msg ok'; } catch (err) { gmsg.textContent = err.message; gmsg.className = 'form-msg err'; } }, 'Deneniyor…'); } }))));

    // ---- yedek ----
    const bmsg = h('div', { class: 'form-msg' });
    const mark = async () => { const v = { last: new Date().toISOString() }; try { await API.setSetting('backup', v); S.backup = v; } catch { /* */ } };
    const xl = (range) => async (e) => {
      const b = e.currentTarget;
      await U.busy(b, async () => {
        try {
          const w = U.weekRange(0);
          const opt = range === 'week'
            ? { from: w.from, to: w.sun, title: 'Rapor yedeği: ' + U.shortDate(w.from) + ' – ' + U.shortDate(w.sun), fileName: 'rapor-yedegi-' + w.from + '_' + w.sun }
            : { from: '', to: '', title: 'Rapor Defteri: tüm raporlar (' + U.shortDate(U.today()) + ')', fileName: 'rapor-defteri-tum-' + U.today() };
          const r = await Export.excel(S, { ...opt, onProgress: (i, n) => { b.textContent = 'Hazırlanıyor ' + i + '/' + n + '…'; } });
          if (range !== 'week') await mark();
          bmsg.textContent = r.count ? r.count + ' rapor Excel\'e yazıldı' + (r.imgCount ? ', ' + r.imgCount + ' görsel dosyaya gömüldü.' : '.') : 'Bu aralıkta rapor yok; boş bir dosya indirildi.';
          bmsg.className = 'form-msg ok';
        } catch (err) { bmsg.textContent = err.message; bmsg.className = 'form-msg err'; }
      }, 'Hazırlanıyor…');
    };
    main.append(section('Yedekleme',
      h('p', { class: 'muted' }, (S.backup && S.backup.last ? 'Son tam yedek: ' + new Date(S.backup.last).toLocaleString('tr-TR') + '. ' : 'Henüz tam yedek alınmadı. ') + 'Veriler Supabase\'de duruyor ama ücretsiz planda otomatik yedek yok. Ayda bir tüm raporları Excel\'e aktarman yeterli.'),
      h('div', { class: 'row' },
        U.btn('Bu haftayı Excel\'e aktar', { variant: 'ghost', onclick: xl('week') }),
        U.btn('Tüm raporları Excel\'e aktar', { variant: 'primary', onclick: xl('all') }),
        U.btn('JSON yedeği indir', { variant: 'ghost', onclick: () => { Export.json(S); mark(); U.toast('JSON yedeği indirildi.'); } })),
      bmsg));
  }

  // ---- görünüm ----
  const t = Theme.get();
  const modeSeg = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Tema' });
  const renderMode = () => U.clear(modeSeg, [['light', 'Açık'], ['dark', 'Koyu'], ['system', 'Sisteme uy']].map(([k, l]) => h('button', { type: 'button', role: 'radio', 'aria-checked': String((Theme.get().mode || 'light') === k), class: 'seg-item' + ((Theme.get().mode || 'light') === k ? ' on' : ''), onclick: () => { Theme.set({ mode: k }); renderMode(); } }, l)));
  renderMode();
  const accents = ['', '#2F8F5B', '#C2410C', '#7C3AED', '#0E7490', '#BE185D'];
  const accSw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Vurgu rengi' });
  const renderAcc = () => U.clear(accSw, accents.map((c) => h('button', { type: 'button', role: 'radio', 'aria-checked': String((Theme.get().accent || '') === c), 'aria-label': c || 'Varsayılan mavi', class: 'swatch' + ((Theme.get().accent || '') === c ? ' on' : ''), style: { background: c || '#2B4ACB' }, onclick: () => { Theme.set({ accent: c }); renderAcc(); } })));
  renderAcc();
  main.append(section('Görünüm',
    h('div', { class: 'form two' },
      h('div', { class: 'field' }, h('span', { class: 'label' }, 'Tema'), modeSeg),
      h('div', { class: 'field' }, h('span', { class: 'label' }, 'Vurgu rengi'), accSw)),
    h('p', { class: 'muted small' }, 'Bu tercih yalnızca bu cihazda geçerli.')));

  // ---- hesap ----
  main.append(section('Hesabım',
    h('div', { class: 'who big' }, avatar(S.me, 44), h('div', null, h('strong', null, S.me.name), h('small', null, S.me.email + ' (' + (isAdmin() ? 'yönetici' : 'çalışan') + ')'))),
    h('div', { class: 'row' }, U.btn('Şifremi değiştir', { variant: 'ghost', onclick: () => passwordDialog() }), U.btn('Çıkış yap', { variant: 'ghost', onclick: () => API.signOut() }))));
});

</script>
<script>
// js/members.js
// Çalışanlar: ekleme, düzenleme, sıralama, şifre sıfırlama, listeden çıkarma ve silme (yalnızca yönetici)
function memberDialog(m) {
  const { h } = U;
  const isNew = !m;
  m = m ? { ...m } : { name: '', email: '', role: 'employee', color: PALETTE[S.members.length % PALETTE.length], avatar: null, active: true, title: '', department: '', phone: '', sort_order: S.employees.length + 1 };
  const inp = (id, value, attrs = {}) => h('input', { class: 'input', id, value: value || '', autocomplete: 'off', ...attrs });
  const name = inp('m-name', m.name, { required: true });
  const title = inp('m-title', m.title, { placeholder: 'Örn: Grafik tasarımcı' });
  const dept = inp('m-dept', m.department, { placeholder: 'Örn: Tasarım', list: 'm-dept-list' });
  const depts = [...new Set(S.members.map((x) => x.department).filter(Boolean))];
  const deptList = h('datalist', { id: 'm-dept-list' }, depts.map((d) => h('option', { value: d })));
  const email = inp('m-email', m.email, { type: 'email', required: true });
  const phone = inp('m-phone', m.phone, { type: 'tel', placeholder: '05xx xxx xx xx' });
  const role = h('select', { class: 'input', id: 'm-role' }, h('option', { value: 'employee' }, 'Çalışan: kendi raporlarını ve görevlerini görür'), h('option', { value: 'admin' }, 'Yönetici: her şeyi görür ve yönetir'));
  role.value = m.role;
  const note = h('textarea', { class: 'input ta', id: 'm-note', rows: 3, placeholder: 'Sadece yöneticiler görür. Örn: izin günleri, hatırlatmalar.' });
  note.value = (!isNew && S.memberNotes[m.id]) || '';
  const sw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Renk' });
  const renderSw = () => U.clear(sw, PALETTE.map((c) => h('button', { type: 'button', role: 'radio', 'aria-checked': String(m.color === c), 'aria-label': c, class: 'swatch' + (m.color === c ? ' on' : ''), style: { background: c }, onclick: () => { m.color = c; renderSw(); renderAv(); } })),
    h('label', { class: 'swatch custom', title: 'Başka renk' }, h('input', { type: 'color', value: m.color, oninput: (e) => { m.color = e.target.value; renderSw(); renderAv(); } }), '+'));
  const avBox = h('div', { class: 'av-edit' });
  const fileIn = h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: async (e) => { const f = e.target.files[0]; if (f) { m.avatar = await U.avatarFromFile(f); renderAv(); } } });
  const renderAv = () => U.clear(avBox, avatar({ ...m, name: name.value || m.name }, 56),
    U.btn(m.avatar ? 'Fotoğrafı değiştir' : 'Fotoğraf ekle', { small: true, variant: 'ghost', onclick: () => fileIn.click() }),
    m.avatar ? U.btn('Kaldır', { small: true, variant: 'ghost', onclick: () => { m.avatar = null; renderAv(); } }) : null, fileIn);
  name.addEventListener('input', renderAv);
  renderSw(); renderAv();
  const msg = h('div', { class: 'form-msg' });
  const field = (label, el, help) => h('div', { class: 'field' }, h('label', { for: el.id }, label), el, help ? h('small', null, help) : null);
  const saveBtn = U.btn(isNew ? 'Ekle' : 'Kaydet', { variant: 'primary', type: 'submit' });
  const isSelf = !isNew && m.id === S.me.id;

  const danger = isNew ? null : h('div', { class: 'danger-zone' },
    h('h3', null, 'Hesap işlemleri'),
    h('div', { class: 'row' },
      m.active && !m.user_id ? U.btn('Davet mesajı', { variant: 'ghost', small: true, onclick: () => { d.close(); inviteDialog(m); } }) : null,
      m.user_id && !isSelf ? U.btn('Şifresini sıfırla', { variant: 'ghost', small: true, onclick: () => { d.close(); resetPasswordDialog(m); } }) : null,
      !isSelf ? U.btn(m.active ? 'Listeden çıkar' : 'Listeye geri al', { variant: 'ghost', small: true, onclick: async () => { d.close(); await toggleActive(m); } }) : null,
      !isSelf ? U.btn('Tamamen sil', { variant: 'ghost', small: true, onclick: () => { d.close(); deleteMemberFlow(m); } }) : null),
    isSelf ? h('p', { class: 'muted small' }, 'Kendi şifreni Ayarlar > Hesabım bölümünden değiştirebilirsin.') : null);

  const form = h('form', { class: 'form', onsubmit: async (e) => {
    e.preventDefault();
    msg.textContent = ''; msg.className = 'form-msg';
    if (!name.value.trim()) { msg.textContent = 'Ad soyad boş olamaz.'; msg.className = 'form-msg err'; return; }
    await U.busy(saveBtn, async () => {
      try {
        const saved = await API.saveMember({ ...m, name: name.value.trim(), email: email.value, role: role.value, title: title.value.trim(), department: dept.value.trim(), phone: phone.value.trim() });
        const n = note.value.trim();
        if (n !== ((S.memberNotes[saved.id]) || '')) await API.saveMemberNote(saved.id, n);
        d.close();
        await loadData();
        U.toast(isNew ? saved.name + ' ekibe eklendi.' : 'Bilgiler kaydedildi.');
        if (isNew) inviteDialog(saved); else Router.refresh();
      } catch (err) { msg.textContent = err.message; msg.className = 'form-msg err'; }
    });
  } },
    avBox,
    h('div', { class: 'form two' }, field('Ad soyad', name), field('Unvan', title)),
    h('div', { class: 'form two' }, field('Departman', dept), deptList, field('Telefon', phone)),
    field('E-posta', email, isNew ? 'Kişi bu e-postayla hesap açacak.' : (m.user_id ? 'Değiştirirsen kişi artık yeni e-postayla giriş yapar.' : null)),
    h('div', { class: 'form two' }, field('Yetki', role), h('div', { class: 'field' }, h('span', { class: 'label' }, 'Renk'), sw)),
    field('Özel not', note, 'Çalışan bu notu göremez.'),
    msg,
    h('div', { class: 'dlg-foot inline' }, U.btn('Vazgeç', { variant: 'ghost', onclick: () => d.close() }), saveBtn),
    danger);
  const d = U.dialog(isNew ? 'Çalışan ekle' : m.name, form, { wide: true });
  setTimeout(() => name.focus(), 50);
}

async function toggleActive(m) {
  if (m.active && !(await U.confirm(m.name + ' listeden çıkarılsın mı?', 'Artık giriş yapamaz, menüde görünmez ve görev alamaz. Raporları ve görevleri silinmez; istediğin zaman geri alabilirsin.', 'Listeden çıkar'))) return;
  try { await API.saveMember({ ...m, active: !m.active }); await loadData(); U.toast(m.active ? m.name + ' listeden çıkarıldı.' : m.name + ' listeye geri alındı.'); Router.refresh(); } catch (e) { U.toast(e.message, 'err'); }
}

function resetPasswordDialog(m) {
  const { h } = U;
  const gen = () => { const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const a = crypto.getRandomValues(new Uint32Array(8)); a.forEach((x) => { s += c[x % c.length]; }); return s; };
  const pw = h('input', { class: 'input', id: 'rp-pw', type: 'text', autocomplete: 'off', value: gen(), minlength: 6 });
  const msg = h('div', { class: 'form-msg' });
  const b = U.btn('Şifreyi değiştir', { variant: 'primary', type: 'submit' });
  const d = U.dialog(m.name + ' için yeni şifre', h('form', { class: 'form', onsubmit: async (e) => {
    e.preventDefault();
    await U.busy(b, async () => {
      try {
        await API.setPassword(m.id, pw.value);
        const text = 'Rapor defteri şifren yenilendi.\n' + (appLink() ? 'Adres: ' + appLink() + '\n' : '') + 'E-posta: ' + m.email + '\nYeni şifre: ' + pw.value + '\nGiriş yaptıktan sonra Ayarlar > Hesabım bölümünden kendi şifreni belirleyebilirsin.';
        U.clear(d.dlg.querySelector('.dlg-body'), h('p', null, 'Şifre değiştirildi. Bu mesajı ' + m.name.split(' ')[0] + '\'e ilet:'), h('pre', { class: 'invite' }, text),
          h('div', { class: 'dlg-foot inline' }, U.btn('Kapat', { variant: 'ghost', onclick: () => d.close() }),
            U.btn('Mesajı kopyala', { variant: 'primary', onclick: async () => { try { await navigator.clipboard.writeText(text); U.toast('Kopyalandı.'); } catch { U.toast('Kopyalanamadı. Metni seçip Ctrl+C ile kopyala.', 'err'); } } })));
      } catch (err) { msg.textContent = err.message; msg.className = 'form-msg err'; }
    });
  } },
    h('p', null, m.name.split(' ')[0] + ' şifresini unuttuysa buradan yeni bir şifre ver. Eski şifresi artık çalışmaz.'),
    h('div', { class: 'field' }, h('label', { for: 'rp-pw' }, 'Yeni şifre'), h('div', { class: 'row' }, pw, U.btn('Yeni öneri', { variant: 'ghost', small: true, onclick: () => { pw.value = gen(); } })), h('small', null, 'En az 6 karakter. Önerilen şifreyi kullanabilir ya da kendin yazabilirsin.')),
    msg, h('div', { class: 'dlg-foot inline' }, U.btn('Vazgeç', { variant: 'ghost', onclick: () => d.close() }), b)));
}

async function deleteMemberFlow(m) {
  const { h } = U;
  const reps = S.reports.filter((r) => r.member_id === m.id).length;
  const tasks = S.tasks.filter((t) => t.member_id === m.id).length;
  const conf = h('input', { class: 'input', id: 'del-conf', autocomplete: 'off', placeholder: m.name });
  const msg = h('div', { class: 'form-msg' });
  const b = U.btn('Kalıcı olarak sil', { variant: 'danger' });
  const d = U.dialog(m.name + ' silinsin mi?', h('div', { class: 'form' },
    h('p', null, 'Bu işlem geri alınamaz. Silinecekler: ' + reps + ' rapor (görselleriyle), ' + tasks + ' görev, giriş hesabı ve özel notlar.'),
    h('p', { class: 'muted' }, 'Kişiyi sadece geçici olarak durdurmak istiyorsan "Listeden çıkar" seçeneğini kullan; o zaman geçmişi korunur.'),
    h('div', { class: 'field' }, h('label', { for: 'del-conf' }, 'Onaylamak için adını yaz: ' + m.name), conf), msg), {
    actions: [U.btn('Vazgeç', { variant: 'ghost', onclick: () => d.close() }), b] });
  b.addEventListener('click', async () => {
    if (U.norm(conf.value) !== U.norm(m.name)) { msg.textContent = 'Ad eşleşmiyor.'; msg.className = 'form-msg err'; conf.focus(); return; }
    await U.busy(b, async () => {
      try { await API.deleteMember(m); d.close(); await loadData(); U.toast(m.name + ' silindi.'); Router.go('#/calisanlar'); }
      catch (e) { msg.textContent = e.message; msg.className = 'form-msg err'; }
    }, 'Siliniyor…');
  });
}

Router.def('calisanlar', (main) => {
  const { h } = U;
  if (!isAdmin()) { Router.go('#/'); return; }
  const emps = S.members.filter((m) => m.role === 'employee' && m.active).sort(byOrder);
  const admins = S.members.filter((m) => m.role === 'admin' && m.active).sort(byOrder);
  const passive = S.members.filter((m) => !m.active).sort(byOrder);
  const move = async (i, dir) => {
    const list = emps.slice(); const j = i + dir; if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    try { await API.setOrder(list.map((m, k) => ({ id: m.id, sort_order: k + 1 }))); await loadData(); Router.refresh(); } catch (e) { U.toast(e.message, 'err'); }
  };
  const status = (m) => !m.active ? h('span', { class: 'status off' }, 'Listeden çıkarıldı') : m.user_id ? h('span', { class: 'status ok' }, 'Hesap açtı') : h('span', { class: 'status wait' }, 'Davet bekliyor');
  const card = (m, i, sortable) => h('article', { class: 'mcard' + (m.active ? '' : ' passive'), style: { '--who': m.color } },
    sortable ? h('div', { class: 'order' },
      h('button', { class: 'icon-btn', 'aria-label': m.name + ' yukarı taşı', disabled: i === 0, onclick: () => move(i, -1) }, '↑'),
      h('button', { class: 'icon-btn', 'aria-label': m.name + ' aşağı taşı', disabled: i === emps.length - 1, onclick: () => move(i, 1) }, '↓')) : null,
    avatar(m, 44),
    h('div', { class: 'mcard-main' },
      h('div', { class: 'mcard-name' }, m.active && m.role === 'employee' ? h('a', { href: '#/calisan/' + m.id }, m.name) : h('strong', null, m.name), status(m)),
      h('div', { class: 'mcard-sub' }, [m.title, m.department].filter(Boolean).join(', ') || h('span', { class: 'muted' }, 'Unvan girilmemiş')),
      h('div', { class: 'mcard-contact' }, m.email, m.phone ? '  |  ' + m.phone : ''),
      S.memberNotes[m.id] ? h('div', { class: 'mcard-note' }, S.memberNotes[m.id]) : null),
    h('div', { class: 'mcard-actions' },
      m.active && !m.user_id ? U.btn('Davet', { small: true, variant: 'ghost', onclick: () => inviteDialog(m) }) : null,
      m.active && m.role === 'employee' ? U.btn('Görev ver', { small: true, variant: 'ghost', onclick: () => Tasks.taskDialog(null, m.id) }) : null,
      U.btn('Düzenle', { small: true, variant: 'primary', onclick: () => memberDialog(m) })));
  main.append(
    pageHead('Çalışanlar', 'Ekle, düzenle, sırala. Menüdeki sıra buradaki sıradır.', U.btn('Çalışan ekle', { variant: 'primary', onclick: () => memberDialog(null) })),
    section('Çalışanlar (' + emps.length + ')', emps.length ? h('div', { class: 'mcards' }, emps.map((m, i) => card(m, i, true))) : h('div', { class: 'empty' }, 'Henüz çalışan yok. "Çalışan ekle" ile başla.')),
    section('Yöneticiler', h('div', { class: 'mcards' }, admins.map((m) => card(m, 0, false)))),
    passive.length ? section('Listeden çıkarılanlar', h('p', { class: 'muted' }, 'Giriş yapamazlar; raporları ve görevleri saklanıyor. Düzenle\'den geri alabilir ya da tamamen silebilirsin.'), h('div', { class: 'mcards' }, passive.map((m) => card(m, 0, false)))) : null);
});

</script>
<script>
// js/assistant.js
// Sesli / yazılı asistan (yalnızca yönetici). Kısayol: Alt+J
const Assistant = (() => {
  const { h } = U;
  let panel = null, log = null, input = null, micBtn = null, recognition = null, greeted = false;
  let voice = (() => { try { return localStorage.getItem('rd-voice') !== '0'; } catch { return true; } })();

  function add(role, text) {
    log.appendChild(h('div', { class: 'msg ' + role }, text));
    log.scrollTop = log.scrollHeight;
  }
  function speak(text) {
    if (!voice || !('speechSynthesis' in window) || !text) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'tr-TR'; speechSynthesis.speak(u); } catch { /* */ }
  }
  const say = (t) => { add('bot', t); speak(t); };

  function greeting() {
    if (!S.employees.length) return 'Merhaba! Ekipte henüz çalışan yok, Ayarlar sayfasından ekleyebilirsin.';
    const came = S.employees.filter((e) => reportedToday(e.id)).map((e) => e.name.split(' ')[0]);
    const miss = S.employees.filter((e) => !reportedToday(e.id)).map((e) => e.name.split(' ')[0]);
    let m = 'Merhaba!';
    if (came.length) m += ' Bugün ' + came.join(', ') + ' rapor gönderdi.';
    if (miss.length) m += ' Henüz göndermeyenler: ' + miss.join(', ') + '.';
    return m;
  }
  function match(name) {
    const n = U.norm(name);
    if (!n) return null;
    return S.employees.find((e) => U.norm(e.name) === n) || S.employees.find((e) => U.norm(e.name).startsWith(n) || n.startsWith(U.norm(e.name).split(' ')[0]));
  }

  async function run(text) {
    if (!text.trim()) return;
    add('user', text);
    if (!(S.gemini && S.gemini.apiKey)) { say('Önce Ayarlar sayfasından Gemini API anahtarını eklemen gerekiyor.'); return; }
    const wait = h('div', { class: 'msg bot wait' }, 'Düşünüyor…'); log.appendChild(wait); log.scrollTop = log.scrollHeight;
    try {
      const resp = await geminiCall({ system: AI.assistantSystem(S.employees.map((e) => e.name)), text, maxTokens: 4000, json: true });
      wait.remove();
      await act(AI.extractJson(resp) || { action: 'speak', text: resp });
    } catch (e) { wait.remove(); add('bot', e.message); speak('Bir hata oluştu.'); }
  }

  async function act(a) {
    const emp = a.employee ? match(a.employee) : null;
    switch (a.action) {
      case 'add_record': {
        if (!emp) return say('Hangi çalışan olduğunu anlayamadım.');
        const link = a.link ? U.safeUrl(U.normalizeUrl(a.link)) : null;
        const r = await API.addReport({ member_id: emp.id, date: U.today(), type: TYPES[a.type] ? a.type : 'gunluk', raw_text: a.text || '', links: link ? [link] : [], images: [], important: !!a.important });
        S.reports.unshift(r); Router.refresh();
        return say(emp.name.split(' ')[0] + ' için rapor eklendi.');
      }
      case 'mark_important_latest': {
        if (!emp) return say('Hangi çalışan olduğunu anlayamadım.');
        const last = reportsOf(emp.id).sort((x, y) => y.date.localeCompare(x.date) || y.created_at.localeCompare(x.created_at))[0];
        if (!last) return say(emp.name.split(' ')[0] + ' için kayıt bulunamadı.');
        const s = await API.updateReport(last.id, { important: true });
        S.reports = S.reports.map((x) => (x.id === s.id ? s : x)); Router.refresh();
        return say(emp.name.split(' ')[0] + ' adlı çalışanın son raporu önemli olarak işaretlendi.');
      }
      case 'open_employee':
      case 'switch_tab':
        if (!emp) return say('Böyle bir çalışan bulamadım.');
        Router.go('#/calisan/' + emp.id);
        return say(emp.name.split(' ')[0] + ' sayfası açıldı.');
      case 'search_summary': {
        const { allData } = await AI.promptData(S, '', '', { withImages: false });
        const out = await geminiCall({ system: AI.ASK_SYSTEM, text: 'KAYITLAR:\n' + JSON.stringify(allData) + '\n\nSORU: ' + (a.query || ''), maxTokens: 8000 });
        return say(out.replace(/^\[\[IMG:[^\]]+\]\]$/gm, '').trim());
      }
      default:
        return say(a.text || 'Anlayamadım, tekrar söyler misin?');
    }
  }

  function listen() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { add('bot', 'Bu tarayıcı sesli komutu desteklemiyor. Chrome ya da Edge kullanabilirsin.'); return; }
    if (!recognition) {
      recognition = new SR(); recognition.lang = 'tr-TR'; recognition.interimResults = false; recognition.maxAlternatives = 1;
      recognition.onstart = () => micBtn.classList.add('on');
      recognition.onend = () => micBtn.classList.remove('on');
      recognition.onresult = (e) => run(e.results[0][0].transcript);
      recognition.onerror = (e) => {
        micBtn.classList.remove('on');
        add('bot', e.error === 'not-allowed' ? 'Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden mikrofona izin ver.' : e.error === 'no-speech' ? 'Ses algılanamadı, tekrar dener misin?' : 'Mikrofon hatası: ' + e.error);
      };
    }
    try { recognition.start(); } catch { /* zaten dinliyor */ }
  }

  function toggle(open) {
    const want = open ?? !panel.classList.contains('open');
    panel.classList.toggle('open', want);
    if (want) {
      if (!greeted) { greeted = true; add('bot', greeting()); }
      setTimeout(() => input.focus(), 50);
    }
  }

  function mount() {
    unmount();
    if (!isAdmin()) return;
    log = h('div', { class: 'as-log', 'aria-live': 'polite' });
    input = h('input', { class: 'input', placeholder: 'Örn: Zeynep için not ekle: sunum bitti', 'aria-label': 'Asistana yaz', onkeydown: (e) => { if (e.key === 'Enter') { const t = input.value; input.value = ''; run(t); } } });
    micBtn = h('button', { class: 'icon-btn mic', 'aria-label': 'Sesle konuş', title: 'Sesle konuş', onclick: listen }, '🎤');
    const voiceBtn = h('button', { class: 'link-btn', onclick: () => { voice = !voice; try { localStorage.setItem('rd-voice', voice ? '1' : '0'); } catch { /* */ } voiceBtn.textContent = voice ? 'Sesli yanıt açık' : 'Sesli yanıt kapalı'; if (!voice) speechSynthesis.cancel(); } }, voice ? 'Sesli yanıt açık' : 'Sesli yanıt kapalı');
    panel = h('div', { class: 'as-panel', role: 'dialog', 'aria-label': 'Asistan' },
      h('div', { class: 'as-head' }, h('strong', null, 'Asistan'), voiceBtn, h('button', { class: 'icon-btn', 'aria-label': 'Asistanı kapat', onclick: () => toggle(false) }, '✕')),
      log,
      h('div', { class: 'as-input' }, micBtn, input, U.btn('Gönder', { variant: 'primary', small: true, onclick: () => { const t = input.value; input.value = ''; run(t); } })),
      h('div', { class: 'as-hint' }, 'Kısayol: Alt+J'));
    const fab = h('button', { class: 'fab', 'aria-label': 'Asistanı aç', title: 'Asistan (Alt+J)', onclick: () => toggle() }, h('span', { 'aria-hidden': 'true' }, '🎙️'));
    document.body.append(panel, fab);
  }
  function unmount() { document.querySelectorAll('.as-panel, .fab').forEach((e) => e.remove()); panel = null; greeted = false; }
  document.addEventListener('keydown', (e) => {
    if (panel && e.altKey && !e.ctrlKey && (e.key === 'j' || e.key === 'J')) { e.preventDefault(); toggle(true); listen(); }
    if (panel && e.key === 'Escape' && panel.classList.contains('open') && !document.querySelector('dialog[open]')) toggle(false);
  });
  return { mount, unmount };
})();

</script>
<script>
// js/main.js
// Başlangıç, giriş ekranı ve oturum yönetimi
(() => {
  const { h } = U;
  const root = document.getElementById('app');
  const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  let starting = false, recovery = false;

  function loading(text = 'Yükleniyor…') { U.clear(root, h('div', { class: 'splash' }, h('span', { class: 'brand-mark big', 'aria-hidden': 'true' }), h('p', null, text))); }
  function fatal(text) { U.clear(root, h('div', { class: 'splash' }, h('span', { class: 'brand-mark big', 'aria-hidden': 'true' }), h('p', null, text), U.btn('Tekrar dene', { variant: 'primary', onclick: () => location.reload() }))); }

  async function boot() {
    Theme.apply();
    loading();
    const cfg = window.RD_CONFIG || {};
    const remote = cfg.supabaseUrl && cfg.supabaseAnonKey && !/BURAYA/.test(cfg.supabaseUrl + cfg.supabaseAnonKey);
    try {
      if (remote) { await U.loadScript(SUPABASE_JS); API = RemoteAPI(cfg); } else API = DemoAPI();
      await API.init();
    } catch (e) { fatal(e.message); return; }
    API.onAuth((ev) => {
      if (ev === 'PASSWORD_RECOVERY') { recovery = true; return; }
      if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') { if (ev === 'SIGNED_IN' && S.me && S.me.email === (API.session() || {}).email) return; start(); }
    });
    start();
  }

  async function start() {
    if (starting) return; starting = true;
    try {
      Assistant.unmount(); Router.unmount();
      if (!API.session()) { S.me = null; if (location.hash) history.replaceState(null, '', location.pathname + location.search); login(); return; }
      loading();
      const me = await API.me();
      if (!me) { noAccess(); return; }
      S.me = me;
      await loadData();
      const main = Shell.build(root);
      Router.mount(main);
      Assistant.mount();
      if (recovery) { recovery = false; passwordDialog('Yeni şifreni belirle'); }
    } catch (e) { console.error(e); fatal('Veriler yüklenemedi: ' + e.message); }
    finally { starting = false; }
  }

  function noAccess() {
    U.clear(root, h('div', { class: 'auth' }, h('div', { class: 'auth-card' },
      h('h1', { class: 'auth-title' }, 'Erişimin yok'),
      h('p', null, (API.session() || {}).email + ' hesabı ekip listesinde değil ya da listeden çıkarılmış. Yöneticinden seni tekrar eklemesini iste.'),
      U.btn('Çıkış yap', { variant: 'primary', onclick: () => API.signOut() }))));
  }

  function login() {
    let mode = 'in';
    const email = h('input', { class: 'input', type: 'email', id: 'l-email', autocomplete: 'email', required: true });
    const pw = h('input', { class: 'input', type: 'password', id: 'l-pw', autocomplete: 'current-password', required: true });
    const pw2 = h('input', { class: 'input', type: 'password', id: 'l-pw2', autocomplete: 'new-password' });
    const pw2Field = h('div', { class: 'field' }, h('label', { for: 'l-pw2' }, 'Şifre (tekrar)'), pw2);
    const msg = h('div', { class: 'form-msg', role: 'alert' });
    const submit = U.btn('Giriş yap', { variant: 'primary', type: 'submit' });
    const tabs = h('div', { class: 'seg wide', role: 'tablist' });
    const forgot = h('button', { type: 'button', class: 'link-btn', onclick: async () => {
      if (!email.value.trim()) { msg.textContent = 'Önce e-posta adresini yaz.'; msg.className = 'form-msg err'; email.focus(); return; }
      try { await API.resetPassword(email.value); msg.textContent = 'Şifre sıfırlama bağlantısı e-postana gönderildi. Gelen kutunu (ve gereksiz klasörünü) kontrol et.'; msg.className = 'form-msg ok'; }
      catch (e) { msg.textContent = e.message; msg.className = 'form-msg err'; }
    } }, 'Şifremi unuttum');
    const help = h('p', { class: 'auth-help' });
    const render = () => {
      U.clear(tabs, [['in', 'Giriş yap'], ['up', 'Hesap oluştur']].map(([k, l]) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(mode === k), class: 'seg-item' + (mode === k ? ' on' : ''), onclick: () => { mode = k; msg.textContent = ''; render(); } }, l)));
      pw2Field.hidden = mode === 'in'; pw2.required = mode === 'up';
      pw.autocomplete = mode === 'in' ? 'current-password' : 'new-password';
      submit.textContent = mode === 'in' ? 'Giriş yap' : 'Hesabı oluştur';
      forgot.hidden = mode !== 'in' || API.mode === 'demo';
      help.textContent = mode === 'in' ? 'Hesabın yoksa "Hesap oluştur" sekmesinden, yöneticinin eklediği e-postayla kendi şifreni belirleyebilirsin.' : 'Yöneticinin seni ekip listesine eklediği e-postayı yaz ve kendine bir şifre belirle (en az 6 karakter).';
    };
    render();
    const form = h('form', { class: 'form', onsubmit: async (e) => {
      e.preventDefault(); msg.textContent = ''; msg.className = 'form-msg';
      await U.busy(submit, async () => {
        try {
          if (mode === 'in') { await API.signIn(email.value, pw.value); return; }
          if (pw.value.length < 6) throw new Error('Şifre en az 6 karakter olmalı.');
          if (pw.value !== pw2.value) throw new Error('Şifreler aynı değil.');
          const st = await API.canSignUp(email.value);
          if (st === 'YOK') throw new Error('Bu e-posta ekip listesinde yok. Yöneticinden seni eklemesini iste.');
          if (st === 'PASIF') throw new Error('Bu e-postanın erişimi kapatılmış. Yöneticinle görüş.');
          if (st === 'VAR') throw new Error('Bu e-postayla zaten hesap açılmış. "Giriş yap" sekmesini kullan.');
          const r = await API.signUp(email.value, pw.value);
          if (r.needsConfirm) { msg.textContent = 'Hesabın oluşturuldu. E-postana gelen onay bağlantısına tıkla, sonra buradan giriş yap.'; msg.className = 'form-msg ok'; mode = 'in'; render(); }
        } catch (err) { msg.textContent = err.message; msg.className = 'form-msg err'; }
      }, mode === 'in' ? 'Giriş yapılıyor…' : 'Oluşturuluyor…');
    } },
      tabs,
      h('div', { class: 'field' }, h('label', { for: 'l-email' }, 'E-posta'), email),
      h('div', { class: 'field' }, h('label', { for: 'l-pw' }, 'Şifre'), pw),
      pw2Field, msg, submit, forgot);
    U.clear(root, h('div', { class: 'auth' },
      h('div', { class: 'auth-side', 'aria-hidden': 'true' },
        h('div', { class: 'auth-lines' }),
        h('div', { class: 'auth-brand' }, h('span', { class: 'brand-mark big' }), h('span', null, 'Rapor Defteri')),
        h('p', { class: 'auth-quote' }, 'Ekibin günlük raporları, tek defterde.')),
      h('div', { class: 'auth-card' },
        h('h1', { class: 'auth-title' }, mode === 'in' ? 'Hoş geldin' : 'Hoş geldin'),
        form, help,
        API.mode === 'demo' ? h('div', { class: 'demo-box' },
          h('strong', null, 'Deneme modu'),
          h('p', null, 'Supabase bağlantısı henüz ayarlanmadı. Örnek verilerle iki rolü de deneyebilirsin.'),
          h('div', { class: 'row' },
            U.btn('Yönetici olarak dene', { variant: 'ghost', onclick: () => API.loginAs('admin') }),
            U.btn('Çalışan olarak dene', { variant: 'ghost', onclick: () => API.loginAs('employee') }))) : null)));
    setTimeout(() => email.focus(), 30);
  }

  // Sekmeye dönünce verileri tazele (başkalarının eklediği raporlar görünsün)
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !S.me || Date.now() - S.loadedAt < 45000) return;
    try {
      await loadData();
      const busyNow = document.querySelector('dialog[open]') || [...document.querySelectorAll('.main textarea')].some((t) => t.value.trim());
      if (!busyNow) Router.refresh(); else Shell.update();
    } catch { /* bağlantı yoksa sessizce geç */ }
  });

  boot();
})();

</script>
