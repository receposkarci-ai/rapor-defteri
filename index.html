<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapor Defteri</title>
<meta name="description" content="Ekibin günlük raporları, tek defterde.">
<meta name="theme-color" content="#2B4ACB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Rapor Defteri — açık ve sade arayüz
   ========================================================= */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --surface-2: #F1F3F6;
  --ink: #1C2430;
  --ink-2: #3F4856;
  --muted: #687182;
  --line: #E1E5EB;
  --line-2: #ECEFF3;
  --accent: #2B4ACB;
  --accent-ink: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--surface));
  --ok: #24804F;
  --ok-soft: #E6F4EC;
  --plan: #6B4FD8;
  --plan-soft: #EFEBFC;
  --star: #C98A12;
  --danger: #B93A26;
  --danger-soft: #FBEDEA;
  --warn-soft: #FFF6E0;
  --shadow: 0 1px 2px rgba(28, 36, 48, .06), 0 4px 14px rgba(28, 36, 48, .05);
  --r-s: 6px; --r: 10px; --r-l: 14px;
  --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #11151B;
  --surface: #181D25;
  --surface-2: #202631;
  --ink: #E7EAEF;
  --ink-2: #C3C9D3;
  --muted: #949CAA;
  --line: #2C3340;
  --line-2: #242A35;
  --accent: #7C93F5;
  --accent-ink: #0E1220;
  --ok: #5CC28A; --ok-soft: #173124;
  --plan: #A994FF; --plan-soft: #251F3E;
  --star: #E8B04A;
  --danger: #F07A64; --danger-soft: #3A1E19;
  --warn-soft: #33290F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grow { flex: 1; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* ---------- marka ---------- */
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand-mark { width: 18px; height: 22px; border-radius: 3px 5px 5px 3px; background: var(--accent); position: relative; flex: 0 0 auto; box-shadow: inset 4px 0 0 rgba(0, 0, 0, .18); }
.brand-mark::after { content: ""; position: absolute; left: 7px; right: 3px; top: 6px; height: 2px; background: rgba(255, 255, 255, .75); box-shadow: 0 4px 0 rgba(255, 255, 255, .5); border-radius: 1px; }
.brand-mark.big { width: 30px; height: 38px; }
.brand-mark.big::after { left: 11px; right: 5px; top: 10px; height: 3px; box-shadow: 0 7px 0 rgba(255, 255, 255, .5); }

/* ---------- düğmeler ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 16px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm, .btn.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.icon-btn { width: 34px; height: 34px; border: 0; background: transparent; border-radius: var(--r-s); cursor: pointer; color: var(--muted); font-size: 15px; display: inline-grid; place-items: center; flex: 0 0 auto; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.link-btn { border: 0; background: none; padding: 2px 4px; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 500; border-radius: 4px; }
.link-btn:hover { color: var(--ink); text-decoration: underline; }
.link-btn.danger:hover { color: var(--danger); }

/* ---------- form ---------- */
.input { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.input:disabled { background: var(--surface-2); color: var(--muted); }
select.input { padding-right: 28px; }
.input.date { width: auto; }
.ta { resize: vertical; min-height: 92px; line-height: 1.55; }
.form { display: grid; gap: 14px; }
.form.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; margin-bottom: 14px; }
.block > .form + .muted { margin-top: 0; }
.field { display: grid; gap: 6px; align-content: start; }
.field > .seg, .field > .swatches { justify-self: start; }
.field > label, .field > .label { font-weight: 600; font-size: 13.5px; }
.field small { color: var(--muted); font-size: 12.5px; }
.form-msg:empty { display: none; }
.form-msg { font-size: 14px; padding: 9px 12px; border-radius: var(--r-s); }
.form-msg.err { background: var(--danger-soft); color: var(--danger); }
.form-msg.ok { background: var(--ok-soft); color: var(--ok); }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.range { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 100%; }
.range .input { width: auto; min-width: 0; flex: 1 1 130px; }

/* parçalı seçim */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 8px; }
.seg.wide { display: flex; }
.seg.wide .seg-item { flex: 1; }
.seg-item { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg-item:hover { color: var(--ink); }
.seg-item.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.seg-item.t-hazir.on { color: var(--ok); }
.seg-item.t-gelecek_hafta.on, .seg-item.n-etkinlik.on { color: var(--plan); }

/* ---------- yerleşim ---------- */
.app { display: flex; min-height: 100vh; }
.side { width: 256px; flex: 0 0 256px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.demo-bar ~ .app .side { height: calc(100vh - 38px); top: 38px; }
.side .brand { padding: 20px 20px 16px; }
.nav { flex: 1; overflow-y: auto; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: 14.5px; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item.muted { color: var(--muted); font-style: italic; }
.nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-group { margin: 16px 10px 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.nav-item.person { padding: 6px 10px; }
.today-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); flex: 0 0 auto; }
.today-dot.on { background: var(--ok); border-color: var(--ok); }
.side-foot { border-top: 1px solid var(--line); padding: 10px; display: grid; gap: 6px; }
.me { display: flex; align-items: center; gap: 10px; padding: 6px 4px 2px 10px; }
.me-text { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
.me-text strong { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-text span { font-size: 12.5px; color: var(--muted); }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main { position: relative; flex: 1; padding: 36px 48px 96px; max-width: 980px; width: 100%; }
.main:focus { outline: none; }
.topbar { display: none; }
.scrim { display: none; }
.demo-bar { position: sticky; top: 0; z-index: 30; min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 6px 16px; background: var(--warn-soft); color: var(--ink); font-size: 13.5px; border-bottom: 1px solid color-mix(in srgb, var(--star) 30%, transparent); }

.avatar { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; flex: 0 0 auto; object-fit: cover; letter-spacing: -.02em; }

/* ---------- sayfa başlığı ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -.025em; font-weight: 700; }
.page-head .sub { margin: 6px 0 0; color: var(--muted); }
.page-actions { display: flex; gap: 8px; align-items: center; }
.person-head { justify-content: flex-start; align-items: center; }
.person-head .avatar { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--who); }
.lede { font-size: 19px; line-height: 1.45; margin: -8px 0 24px; max-width: 60ch; color: var(--ink-2); }

.block { margin-bottom: 40px; }
.block-title { font-size: 16px; font-weight: 700; margin: 0 0 14px; letter-spacing: -.01em; }
.block > .muted { margin: -6px 0 16px; max-width: 70ch; }
.empty { padding: 28px 20px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); text-align: center; }
.notice { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r); background: var(--warn-soft); margin-bottom: 20px; font-size: 14.5px; }
.notice.err { background: var(--danger-soft); color: var(--danger); }

/* ---------- bugün ---------- */
.who-today { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-bottom: 40px; }
.people { display: flex; flex-wrap: wrap; gap: 8px; }
.person-chip { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); text-decoration: none; color: var(--ink); }
.person-chip:hover { border-color: var(--accent); }
.person-chip span { display: grid; line-height: 1.25; }
.person-chip strong { font-size: 14px; }
.person-chip small { color: var(--muted); font-size: 12.5px; }

.week-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.week { width: 100%; border-collapse: collapse; min-width: 520px; }
.week th, .week td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line-2); }
.week tbody tr:last-child > * { border-bottom: 0; }
.week thead th { font-size: 13px; font-weight: 600; color: var(--muted); }
.week thead th small { display: block; font-size: 18px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.week thead th.is-today small { color: var(--accent); }
.week tbody th { text-align: left; font-weight: 500; padding-left: 14px; white-space: nowrap; }
.week td.is-today { background: var(--accent-soft); }
.cell { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1.5px dashed var(--line); font-size: 13px; font-weight: 700; color: transparent; }
.cell.on { border: 0; background: var(--who); color: #fff; }
.cell.on.done { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ok); }
td.future .cell { border-style: dotted; opacity: .5; }

.who { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 600; }
.who > div { display: grid; line-height: 1.3; }
.who small { color: var(--muted); font-weight: 400; font-size: 13px; }
a.who:hover { color: var(--accent); }
.who.big strong { font-size: 16px; }

/* ---------- zaman çizgisi ---------- */
.timeline { display: grid; gap: 30px; }
.day { display: grid; grid-template-columns: 92px 1fr; gap: 0 20px; }
.day-head { position: sticky; top: 16px; align-self: start; display: grid; justify-items: start; line-height: 1.1; }
.demo-bar ~ .app .day-head { top: 54px; }
.day-num { font-size: 44px; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--ink); }
.day-meta { display: grid; gap: 2px; margin-top: 4px; }
.day-meta strong { font-size: 14px; font-weight: 600; }
.day-meta span { font-size: 12.5px; color: var(--muted); }
.day-items { display: grid; gap: 10px; min-width: 0; }

.entry { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px 14px 20px; min-width: 0; }
.entry::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px; border-radius: var(--r) 0 0 var(--r); background: var(--who, var(--line)); }
.entry.important { border-color: color-mix(in srgb, var(--star) 55%, var(--line)); background: color-mix(in srgb, var(--star) 5%, var(--surface)); }
.entry-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 26px; margin-bottom: 6px; }
.entry-head .who { font-size: 14px; }
.entry-time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.entry-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.6; max-width: 72ch; }
.entry-text.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.link-btn.more { padding-left: 0; margin-top: 4px; color: var(--accent); }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.badge.t-hazir { background: var(--ok-soft); color: var(--ok); }
.badge.t-gelecek_hafta, .badge.n-etkinlik { background: var(--plan-soft); color: var(--plan); }
.badge.n-toplanti { background: var(--accent-soft); color: var(--accent); }
.entry.note::before { background: var(--accent); }
.entry.note.n-etkinlik::before { background: var(--plan); }
.star { border: 0; background: none; font-size: 18px; line-height: 1; color: color-mix(in srgb, var(--muted) 45%, transparent); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.star:hover { color: var(--star); }
.star.on { color: var(--star); }
.star.static { cursor: default; }

.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.thumb { position: relative; width: 84px; height: 84px; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2); cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb img.missing { opacity: 0; }
.thumbs.edit .thumb { cursor: default; }
.thumbs.edit:empty { display: none; }
.thumb-x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .65); color: #fff; font-size: 11px; cursor: pointer; }
.link-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; text-decoration: none; color: var(--ink-2); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip::before { content: "↗"; color: var(--accent); }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* filtreler */
.filters, .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.fchip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.fchip:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.fchip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.fchip.on small { color: color-mix(in srgb, var(--surface) 70%, transparent); }
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 28px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.filter-bar .input { width: auto; min-height: 36px; }
.filter-bar .search { flex: 1 1 200px; }

/* ---------- yazma alanı ---------- */
.composer { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px; box-shadow: var(--shadow); }
.composer.editing { box-shadow: none; border: 0; padding: 0; }
.composer.drop { border-color: var(--accent); background: var(--accent-soft); }
.comp-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.composer .ta { border-color: var(--line-2); background: var(--bg); }
.composer .ta:focus { background: var(--surface); }
.links-edit { display: grid; gap: 6px; }
.link-row { display: flex; gap: 6px; align-items: center; }
.link-row .input { min-height: 36px; font-size: 14px; }
.links-edit:empty { display: none; }
.comp-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.comp-tools, .comp-save { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 12.5px; color: var(--muted); }

/* ---------- yapay zekâ ---------- */
.ai-out { margin-top: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.ai-text { padding: 20px 24px; line-height: 1.65; max-width: 78ch; overflow-wrap: anywhere; }
.ai-gap { height: .7em; }
.ai-rule { height: 1px; background: var(--line); margin: 14px 0; }
.ai-img { max-width: 220px; max-height: 220px; border-radius: 6px; display: block; margin: 8px 0; border: 1px solid var(--line); }
.ai-actions { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line-2); }
.thinking { margin-top: 18px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.thinking::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.block .row + .ai-out, .block .row ~ div > .ai-out { margin-top: 18px; }
.block .ta + .row { margin-top: 10px; }

/* ---------- tablo ---------- */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 14px; }
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); }
.table td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tr.passive td { opacity: .6; }
.table .actions { text-align: right; white-space: nowrap; }
.status { font-size: 13px; font-weight: 600; }
.status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: currentColor; }
.status.ok { color: var(--ok); }
.status.wait { color: var(--star); }
.status.off { color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: pointer; position: relative; display: grid; place-items: center; }
.swatch.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.swatch.custom { background: var(--surface-2); color: var(--muted); font-weight: 700; overflow: hidden; }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.av-edit { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.invite { white-space: pre-wrap; background: var(--surface-2); padding: 14px; border-radius: var(--r-s); font-family: inherit; font-size: 14px; line-height: 1.55; margin: 12px 0; }

/* ---------- diyalog ---------- */
.dlg { border: 0; border-radius: var(--r-l); padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
.dlg.wide { width: min(760px, calc(100vw - 32px)); }

.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 16px 4px 22px; }

.dlg-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 22px 18px; }

/* ---------- bildirim ---------- */

.toast { background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); transition: opacity .3s; }

/* ---------- giriş ---------- */
.splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); text-align: center; padding: 16px; }

/* ---------- görevler ---------- */
.task-board { display: grid; gap: 22px; }

.task-group.overdue .tasks { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.task-empty { margin: 0; padding: 10px 14px; border: 1px dashed var(--line); border-radius: var(--r); }

.task-actions { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
.badge.p-gunluk { background: var(--accent-soft); color: var(--accent); }
.badge.p-haftalik { background: var(--plan-soft); color: var(--plan); }
.badge.p-aylik { background: var(--warn-soft); color: color-mix(in srgb, var(--star) 75%, var(--ink)); }
.prog { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.prog-bar { width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog-bar span { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.tgrid td { text-align: left; }
.tgrid thead th { text-align: left; font-size: 13px; }
.late { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); font-weight: 700; font-size: 13px; text-decoration: none; }
.date-nav { display: inline-flex; align-items: center; gap: 4px; }
.date-nav .icon-btn { font-size: 20px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-item { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 14px; }
.pick-item:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pick-item input { accent-color: var(--accent); }
.pick-item.all { border-style: dashed; }

/* ---------- çalışanlar ---------- */
.nav-group { display: flex; align-items: center; justify-content: space-between; }
.nav-group-link { font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; }
.nav-group-link:hover { text-decoration: underline; }
.mcards { display: grid; gap: 10px; }
.mcard { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: relative; }
.mcard::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px; border-radius: var(--r) 0 0 var(--r); background: var(--who); }

.mcard .order { display: grid; gap: 0; }

.mcard-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.mcard-name { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 16px; font-weight: 700; }
.mcard-name a { color: var(--ink); text-decoration: none; }
.mcard-name a:hover { color: var(--accent); }
.mcard-sub { font-size: 14px; color: var(--ink-2); }
.mcard-contact { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.mcard-note { font-size: 13px; margin-top: 4px; padding: 6px 10px; border-radius: 6px; background: var(--warn-soft); white-space: pre-wrap; }
.mcard-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.private-note { margin: -12px 0 24px; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); font-size: 14px; white-space: pre-wrap; }
.danger-zone { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; }
.danger-zone h3 { margin: 0 0 8px; font-size: 14px; }
.person-head .page-actions { margin-left: auto; }
@media (max-width: 900px) {
  .task { flex-wrap: wrap; }
  .task-actions { width: 100%; justify-content: flex-start; padding-left: 36px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
// js/util.js
// Ortak yardımcılar: DOM, tarih, görsel, bildirim ve diyalog
const U = (() => {
  // h('div', {class:'x', onclick: fn}, child1, [child2, child3], 'metin')
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv; } }
        else if (k === 'html') el.innerHTML = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    append(el, kids);
    return el;
  }
  function append(el, kids) {
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  function clear(el, ...kids) { el.replaceChildren(); return append(el, kids); }
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---- tarih ----
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => iso(new Date());
  const parse = (s) => new Date(s + 'T00:00:00');
  const DAYS = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  const SHORT_DAYS = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
  const MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  const weekday = (s) => { const d = parse(s); return isNaN(d) ? '' : DAYS[d.getDay()]; };
  const trDate = (s) => { const d = parse(s); return isNaN(d) ? s : d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
  const shortDate = (s) => { const d = parse(s); return isNaN(d) ? s : pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); };
  function weekRange(offset = 0) {
    const d = new Date(); const day = d.getDay();
    const mon = new Date(d); mon.setDate(d.getDate() + (day === 0 ? -6 : 1 - day) + offset * 7);
    const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { from: iso(mon), to: iso(fri), sun: iso(sun) };
  }
  function relDay(s) {
    const t = today();
    if (s === t) return 'Bugün';
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (s === iso(y)) return 'Dün';
    return weekday(s);
  }

  // ---- metin ----
  const norm = (s) => String(s || '').trim().toLocaleLowerCase('tr').replace(/\s+/g, ' ');
  function normalizeUrl(u) {
    u = String(u || '').trim();
    if (!u) return u;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }
  function safeUrl(u) {
    try { const x = new URL(u); return x.protocol === 'http:' || x.protocol === 'https:' ? x.href : null; } catch { return null; }
  }
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
  const initials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toLocaleUpperCase('tr') || '?';

  // Metindeki adresleri tıklanabilir yapar (güvenli)
  function linkify(text) {
    const frag = document.createDocumentFragment();
    String(text || '').split(/(https?:\/\/[^\s]+)/g).forEach((part) => {
      const url = /^https?:\/\//.test(part) ? safeUrl(part) : null;
      frag.appendChild(url ? h('a', { href: url, target: '_blank', rel: 'noopener' }, part) : document.createTextNode(part));
    });
    return frag;
  }

  // ---- görsel ----
  function readAsDataURL(blob) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
  }
  async function loadImage(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Görsel açılamadı')); i.src = src; });
  }
  // Büyük görselleri küçültüp JPEG'e çevirir (depolama ve hız için)
  async function compressImage(file, max = 1600, quality = 0.84) {
    if (file.type === 'image/gif') return file;
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), hgt = Math.round(img.naturalHeight * scale);
      const c = document.createElement('canvas'); c.width = w; c.height = hgt;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hgt); ctx.drawImage(img, 0, 0, w, hgt);
      return await new Promise((res) => c.toBlob((b) => res(b || file), 'image/jpeg', quality));
    } finally { URL.revokeObjectURL(url); }
  }
  async function avatarFromFile(file) {
    const blob = await compressImage(file, 160, 0.85);
    return readAsDataURL(blob);
  }

  // ---- bildirim ----
  function toast(msg, kind = 'ok') {
    let box = document.getElementById('toasts');
    if (!box) { box = h('div', { id: 'toasts', role: 'status', 'aria-live': 'polite' }); document.body.appendChild(box); }
    const t = h('div', { class: 'toast ' + kind }, msg);
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, kind === 'err' ? 6000 : 3200);
  }

  // ---- diyalog ----
  function dialog(title, body, { actions, wide, onClose } = {}) {
    const dlg = h('dialog', { class: 'dlg' + (wide ? ' wide' : '') });
    const close = () => { dlg.close(); };
    dlg.addEventListener('close', () => { dlg.remove(); onClose && onClose(); });
    dlg.addEventListener('click', (e) => { if (e.target === dlg) close(); });
    append(dlg, [
      h('div', { class: 'dlg-head' }, h('h2', null, title), h('button', { class: 'icon-btn', 'aria-label': 'Kapat', onclick: close }, '✕')),
      h('div', { class: 'dlg-body' }, body),
      actions ? h('div', { class: 'dlg-foot' }, actions) : null,
    ]);
    document.body.appendChild(dlg);
    dlg.showModal();
    return { dlg, close };
  }
  function confirm(title, text, okLabel = 'Sil', danger = true) {
    return new Promise((resolve) => {
      let done = false;
      const d = dialog(title, h('p', null, text), {
        onClose: () => { if (!done) resolve(false); },
        actions: [
          h('button', { class: 'btn ghost', onclick: () => d.close() }, 'Vazgeç'),
          h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: () => { done = true; resolve(true); d.close(); } }, okLabel),
        ],
      });
    });
  }

  function btn(label, opts = {}) {
    return h('button', { type: opts.type || 'button', class: 'btn ' + (opts.variant || '') + (opts.small ? ' sm' : ''), onclick: opts.onclick, disabled: opts.disabled, title: opts.title, id: opts.id }, label);
  }
  // Uzun süren işlemlerde düğmeyi kilitler
  async function busy(button, fn, label = 'Bekleyin…') {
    const old = button.textContent; button.disabled = true; button.textContent = label;
    try { return await fn(); } finally { button.disabled = false; button.textContent = old; }
  }
  function download(blob, name) {
    const a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function loadScript(src) {
    return new Promise((res, rej) => {
      if (document.querySelector('script[src="' + src + '"]')) return res();
      const s = h('script', { src }); s.onload = res; s.onerror = () => rej(new Error('Kütüphane yüklenemedi: ' + src + '. İnternet bağlantınızı kontrol edin.'));
      document.head.appendChild(s);
    });
  }
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  return { h, append, clear, esc, iso, today, parse, weekday, shortDay: (s) => SHORT_DAYS[parse(s).getDay()], trDate, shortDate, weekRange, relDay, DAYS, MONTHS, norm, normalizeUrl, safeUrl, hostOf, initials, linkify, readAsDataURL, compressImage, avatarFromFile, toast, dialog, confirm, btn, busy, download, loadScript, uid };
})();

</script>
<script>
// js/api-demo.js
// Deneme modu: Supabase ayarı yapılmadığında çalışır. Veriler yalnızca bu tarayıcıda durur.
// Gerçek sürümdeki yetki kurallarını aynen taklit eder.
const DemoAPI = () => {
  const KEY = 'rd-demo-v1';
  let db = null;
  let images = {}; // yol -> dataURL
  const IKEY = 'rd-demo-images-v1';
  const saveImages = () => { try { localStorage.setItem(IKEY, JSON.stringify(images)); } catch { /* kota dolarsa yalnızca bellekte kalır */ } };
  const listeners = [];
  const emit = (e) => listeners.forEach((cb) => cb(e));
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const now = () => new Date().toISOString();

  function seed() {
    const w = U.weekRange(0);
    const day = (i) => { const d = U.parse(w.from); d.setDate(d.getDate() + i); return U.iso(d); };
    const t = U.today();
    const cap = (s) => (s > t ? t : s);
    const m = (name, email, role, color, title, department) => ({ id: U.uid(), name, email, role, color, avatar: null, active: true, user_id: null, created_at: now(), title: title || null, department: department || null, phone: null, sort_order: 0 });
    const admin = m('Yönetici', 'yonetici@ornek.com', 'admin', '#3B6CF6');
    const zey = m('Zeynep Kaya', 'zeynep@ornek.com', 'employee', '#D9822B', 'Grafik tasarımcı', 'Tasarım');
    const yav = m('Yavuz Demir', 'yavuz@ornek.com', 'employee', '#2F8F5B', 'Proje yöneticisi', 'Operasyon');
    const elis = m('Elis Arslan', 'elis@ornek.com', 'employee', '#9B51E0', 'Web geliştirici', 'Yazılım');
    const ela = m('Ela Şahin', 'ela@ornek.com', 'employee', '#D1435B', 'Satın alma uzmanı', 'Operasyon');
    const r = (mem, date, raw_text, type = 'gunluk', extra = {}) => ({ id: U.uid(), member_id: mem.id, date: cap(date), type, raw_text, links: [], images: [], important: false, created_by: null, created_at: now(), updated_at: now(), ...extra });
    return {
      users: { 'yonetici@ornek.com': 'deneme', 'zeynep@ornek.com': 'deneme' },
      session: null,
      members: [admin, zey, yav, elis, ela],
      reports: [
        r(zey, day(0), 'Haftalık sosyal medya takvimini hazırladım, perşembe gününe kadar onaya gönderiyorum.'),
        r(yav, day(0), 'Müşteri sunumu için ilk taslak tamam. Grafiklerde güncel ay verisini bekliyorum.'),
        r(elis, day(1), 'Web sitesindeki iletişim formu hatası çözüldü, test ettim.', 'hazir', { links: ['https://example.com/form'] }),
        r(zey, day(1), 'Kampanya görsellerinin ilk iki versiyonu hazır.', 'hazir', { important: true }),
        r(ela, day(2), 'Tedarikçiyle görüştüm, teslim tarihi bir hafta öne çekildi.'),
        r(yav, day(2), 'Sunum müşteriye gönderildi. Geri dönüş cuma bekleniyor.', 'hazir'),
        r(elis, day(3), 'Gelecek hafta mobil uyum testlerine başlayacağım.', 'gelecek_hafta'),
        r(zey, day(3), 'Bülten metni yazıldı, son okuma Ela\'da.'),
      ],
      notes: [
        { id: U.uid(), date: cap(day(1)), type: 'toplanti', text: 'Haftalık toplantı: kampanya takvimi ve sunum teslim tarihleri konuşuldu. Görsel onayları perşembe verilecek.', created_by: null, created_at: now() },
        { id: U.uid(), date: cap(day(3)), type: 'etkinlik', text: 'Gelecek hafta salı 14.00\'te müşteri ziyareti var.', created_by: null, created_at: now() },
      ],
      settings: {},
      memberNotes: {},
      tasks: [
        task(zey, 'Sosyal medya hesaplarını kontrol et', 'gunluk', true, w.from, 'Yorumları yanıtla, mesajları cevapla.'),
        task(zey, 'Kampanya afişini bitir', 'haftalik', false, w.from, ''),
        task(yav, 'Müşteri sunumunu güncelle', 'haftalik', false, w.from, 'Geri bildirimleri işle.'),
        task(yav, 'Aylık proje raporu', 'aylik', true, U.today().slice(0, 8) + '01', ''),
        task(elis, 'Site yedeğini al', 'haftalik', true, w.from, ''),
        task(ela, 'Tedarikçi faturalarını dosyala', 'aylik', false, U.today().slice(0, 8) + '01', ''),
      ],
      checks: [],
    };
    function task(mem, title, period, recurring, start_date, description) {
      return { id: U.uid(), member_id: mem.id, title, description, period, recurring, start_date, end_date: null, important: false, created_by: null, created_at: now(), updated_at: now() };
    }
  }
  function load() {
    try { db = JSON.parse(localStorage.getItem(KEY)); } catch { db = null; }
    if (!db || !db.members) { db = seed(); save(); }
    db.tasks = db.tasks || []; db.checks = db.checks || []; db.memberNotes = db.memberNotes || {};
    try { images = JSON.parse(localStorage.getItem(IKEY)) || {}; } catch { images = {}; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { /* depolama kapalı olabilir */ } }
  const user = () => (db.session ? db.members.find((m) => m.email === db.session && m.active) : null);
  const isAdmin = () => { const u = user(); return !!u && u.role === 'admin'; };
  function need() { if (!user()) throw new Error('Oturum kapalı. Tekrar giriş yap.'); }
  const visibleReport = (r) => isAdmin() || (user() && r.member_id === user().id);
  const delay = () => new Promise((r) => setTimeout(r, 60));

  return {
    mode: 'demo',
    async init() { load(); },
    session: () => (db.session ? { email: db.session } : null),
    onAuth: (cb) => listeners.push(cb),
    async signIn(email, pw) {
      await delay(); email = email.trim().toLowerCase();
      if (db.users[email] !== pw) throw new Error('E-posta ya da şifre hatalı.');
      db.session = email; save(); emit('SIGNED_IN');
    },
    async canSignUp(email) {
      const m = db.members.find((x) => x.email === email.trim().toLowerCase());
      if (!m) return 'YOK'; if (!m.active) return 'PASIF'; if (db.users[m.email]) return 'VAR'; return 'UYGUN';
    },
    async signUp(email, pw) {
      await delay(); email = email.trim().toLowerCase();
      const st = await this.canSignUp(email);
      if (st === 'VAR') throw new Error('Bu e-postayla zaten hesap açılmış. Giriş yap ekranını kullan.');
      if (st !== 'UYGUN') throw new Error('Bu e-posta ekip listesinde yok. Yöneticinden seni eklemesini iste.');
      if (pw.length < 6) throw new Error('Şifre en az 6 karakter olmalı.');
      db.users[email] = pw; db.session = email; save(); emit('SIGNED_IN');
      return { needsConfirm: false };
    },
    async signOut() { db.session = null; save(); emit('SIGNED_OUT'); },
    async updatePassword(pw) { need(); if (pw.length < 6) throw new Error('Şifre en az 6 karakter olmalı.'); db.users[db.session] = pw; save(); },
    async resetPassword() { throw new Error('Deneme modunda şifre sıfırlama e-postası gönderilmez. Şifre: deneme'); },
    async loginAs(role) {
      const m = db.members.find((x) => x.active && x.role === role);
      if (!m) throw new Error('Bu rolde aktif kişi yok.');
      db.users[m.email] = db.users[m.email] || 'deneme';
      db.session = m.email; save(); emit('SIGNED_IN');
    },
    async resetDemo() { localStorage.removeItem(KEY); localStorage.removeItem(IKEY); images = {}; load(); emit('SIGNED_OUT'); },

    async me() { return user() ? { ...clone(user()), user_id: 'demo-' + user().id } : null; },
    async members() { need(); return clone(isAdmin() ? db.members : db.members.filter((m) => m.id === user().id)).map((m) => ({ ...m, user_id: db.users[m.email] ? 'demo-' + m.id : null })); },
    async saveMember(m) {
      need(); await delay();
      if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.');
      const email = String(m.email || '').trim().toLowerCase();
      if (!m.name || !m.name.trim()) throw new Error('İsim boş olamaz.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Geçerli bir e-posta yaz.');
      if (db.members.some((x) => x.email === email && x.id !== m.id)) throw new Error('Bu e-posta zaten ekip listesinde.');
      const row = { name: m.name.trim(), email, role: m.role || 'employee', color: m.color || '#3B6CF6', avatar: m.avatar || null, active: m.active !== false, title: m.title || null, department: m.department || null, phone: m.phone || null, sort_order: m.sort_order || 0 };
      if (m.id) {
        const cur = db.members.find((x) => x.id === m.id);
        if (cur.role === 'admin' && cur.active && (row.role !== 'admin' || !row.active) && !db.members.some((x) => x.role === 'admin' && x.active && x.id !== cur.id)) throw new Error('En az bir aktif yönetici kalmalı.');
        if (cur.email !== email && db.users[cur.email]) { db.users[email] = db.users[cur.email]; delete db.users[cur.email]; if (db.session === cur.email) db.session = email; }
        Object.assign(cur, row); save(); return clone(cur);
      }
      const n = { id: U.uid(), ...row, user_id: null, created_at: now() };
      db.members.push(n); save(); return clone(n);
    },

    async setOrder(list) { need(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.'); list.forEach(({ id, sort_order }) => { const m = db.members.find((x) => x.id === id); if (m) m.sort_order = sort_order; }); save(); },
    async setPassword(memberId, pw) {
      need(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.');
      if (String(pw || '').length < 6) throw new Error('Şifre en az 6 karakter olmalı.');
      const m = db.members.find((x) => x.id === memberId);
      if (!m || !db.users[m.email]) throw new Error('Bu kişi henüz hesap açmamış; şifresini kendisi belirleyecek.');
      db.users[m.email] = pw; save();
    },
    async deleteMember(m) {
      need(); await delay(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.');
      if (m.id === user().id) throw new Error('Kendi kaydını silemezsin.');
      const cur = db.members.find((x) => x.id === m.id);
      if (cur && cur.role === 'admin' && cur.active && !db.members.some((x) => x.role === 'admin' && x.active && x.id !== cur.id)) throw new Error('En az bir aktif yönetici kalmalı.');
      db.reports.filter((r) => r.member_id === m.id).forEach((r) => (r.images || []).forEach((p) => delete images[p]));
      const taskIds = new Set(db.tasks.filter((t) => t.member_id === m.id).map((t) => t.id));
      db.reports = db.reports.filter((r) => r.member_id !== m.id);
      db.tasks = db.tasks.filter((t) => !taskIds.has(t.id));
      db.checks = db.checks.filter((c) => !taskIds.has(c.task_id));
      delete db.memberNotes[m.id];
      if (cur) delete db.users[cur.email];
      db.members = db.members.filter((x) => x.id !== m.id); save(); saveImages();
    },
    async memberNotes() { need(); return isAdmin() ? clone(db.memberNotes) : {}; },
    async saveMemberNote(memberId, note) { need(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.'); db.memberNotes[memberId] = note; save(); },

    async tasks() { need(); return clone(db.tasks.filter((t) => isAdmin() || t.member_id === user().id)); },
    async addTasks(rows) {
      need(); await delay(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.');
      const out = rows.map((r) => ({ id: U.uid(), description: '', recurring: false, end_date: null, important: false, ...r, created_by: user().id, created_at: now(), updated_at: now() }));
      if (out.some((t) => !String(t.title || '').trim())) throw new Error('Görev başlığı boş olamaz.');
      db.tasks.push(...out); save(); return clone(out);
    },
    async updateTask(id, patch) {
      need(); await delay(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.');
      const t = db.tasks.find((x) => x.id === id); Object.assign(t, patch, { updated_at: now() }); save(); return clone(t);
    },
    async deleteTask(id) { need(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.'); db.tasks = db.tasks.filter((t) => t.id !== id); db.checks = db.checks.filter((c) => c.task_id !== id); save(); },
    async checks(since) {
      need(); const mine = new Set(db.tasks.filter((t) => isAdmin() || t.member_id === user().id).map((t) => t.id));
      return clone(db.checks.filter((c) => mine.has(c.task_id) && c.period_key >= since));
    },
    async setCheck(taskId, key, done, note = '') {
      need(); await delay();
      const t = db.tasks.find((x) => x.id === taskId);
      if (!t || !(isAdmin() || t.member_id === user().id)) throw new Error('Kaydedilemedi: yetki yok.');
      db.checks = db.checks.filter((c) => !(c.task_id === taskId && c.period_key === key));
      let c = null;
      if (done) { c = { task_id: taskId, period_key: key, note, done_by: user().id, done_at: now() }; db.checks.push(c); }
      save(); return c && clone(c);
    },

    async reports() { need(); return clone(db.reports.filter(visibleReport).sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at))); },
    async addReport(r) {
      need(); await delay();
      if (!isAdmin() && r.member_id !== user().id) throw new Error('Rapor kaydedilemedi: yetki yok.');
      const n = { id: U.uid(), date: U.today(), type: 'gunluk', raw_text: '', links: [], images: [], ...r, important: isAdmin() ? !!r.important : false, created_by: user().id, created_at: now(), updated_at: now() };
      db.reports.push(n); save(); return clone(n);
    },
    async updateReport(id, patch) {
      need(); await delay();
      const cur = db.reports.find((x) => x.id === id);
      if (!cur || !visibleReport(cur)) throw new Error('Rapor güncellenemedi: yetki yok.');
      const p = { ...patch };
      if (!isAdmin()) { delete p.important; delete p.member_id; }
      Object.assign(cur, p, { updated_at: now() }); save(); return clone(cur);
    },
    async deleteReport(r) {
      need(); await delay();
      const cur = db.reports.find((x) => x.id === r.id);
      if (!cur || !visibleReport(cur)) throw new Error('Rapor silinemedi: yetki yok.');
      db.reports = db.reports.filter((x) => x.id !== r.id); (cur.images || []).forEach((p) => delete images[p]); save(); saveImages();
    },

    async uploadImage(memberId, blob) {
      need();
      if (!isAdmin() && memberId !== user().id) throw new Error('Görsel yüklenemedi: yetki yok.');
      const path = memberId + '/' + U.uid() + '.jpg';
      images[path] = await U.readAsDataURL(blob); saveImages();
      return path;
    },
    async imageUrls(paths) { const o = {}; paths.forEach((p) => { if (images[p]) o[p] = images[p]; }); return o; },
    async imageDataUrl(path) { if (!images[path]) throw new Error('Görsel bulunamadı'); return images[path]; },
    async removeImages(paths) { paths.forEach((p) => delete images[p]); saveImages(); },

    async notes() { need(); return clone(db.notes.slice().sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at))); },
    async addNote(n) {
      need(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.');
      const x = { id: U.uid(), date: U.today(), type: 'toplanti', ...n, created_by: user().id, created_at: now() };
      db.notes.push(x); save(); return clone(x);
    },
    async deleteNote(id) { need(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.'); db.notes = db.notes.filter((n) => n.id !== id); save(); },

    async getSetting(key) { need(); if (!isAdmin()) return null; return db.settings[key] ?? null; },
    async setSetting(key, value) { need(); if (!isAdmin()) throw new Error('Bu işlem için yönetici yetkisi gerekir.'); db.settings[key] = value; save(); },
  };
};

</script>
<script>
// js/api-remote.js
// Supabase bağlantısı (gerçek, ortak veri)
const RemoteAPI = (cfg) => {
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  const BUCKET = 'report-images';
  let session = null;
  let myMember = null;

  const fail = (error, fallback) => {
    if (!error) return;
    const m = error.message || String(error);
    if (/YETKISIZ_EPOSTA|Database error saving new user/i.test(m)) throw new Error('Bu e-posta ekip listesinde yok. Yöneticinden seni eklemesini iste.');
    if (/SON_YONETICI/.test(m)) throw new Error('En az bir aktif yönetici kalmalı.');
    if (/Invalid login credentials/i.test(m)) throw new Error('E-posta ya da şifre hatalı.');
    if (/Email not confirmed/i.test(m)) throw new Error('E-posta adresin henüz onaylanmamış. Gelen kutundaki onay bağlantısına tıkla.');
    if (/already registered/i.test(m)) throw new Error('Bu e-postayla zaten hesap açılmış. Giriş yap ekranını kullan.');
    if (/Password should be at least/i.test(m)) throw new Error('Şifre en az 6 karakter olmalı.');
    if (/rate limit/i.test(m)) throw new Error('Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar dene.');
    if (/duplicate key.*members_email/i.test(m)) throw new Error('Bu e-posta zaten ekip listesinde.');
    if (/EPOSTA_KULLANIMDA/.test(m)) throw new Error('Bu e-posta başka bir kişide kullanılıyor.');
    if (/GECERSIZ_EPOSTA/.test(m)) throw new Error('Geçerli bir e-posta yaz.');
    if (/KISA_SIFRE/.test(m)) throw new Error('Şifre en az 6 karakter olmalı.');
    if (/HESAP_YOK/.test(m)) throw new Error('Bu kişi henüz hesap açmamış; şifresini kendisi belirleyecek.');
    if (/KENDINI_SILEMEZ/.test(m)) throw new Error('Kendi kaydını silemezsin.');
    if (/YETKI_YOK/.test(m)) throw new Error('Bu işlem için yönetici yetkisi gerekir.');
    if (/Failed to fetch|NetworkError/i.test(m)) throw new Error('Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.');
    throw new Error(fallback ? fallback + ': ' + m : m);
  };

  const listeners = [];
  sb.auth.onAuthStateChange((event, s) => {
    session = s;
    if (event === 'SIGNED_OUT') myMember = null;
    listeners.forEach((cb) => cb(event));
  });

  return {
    mode: 'remote',
    async init() { const { data } = await sb.auth.getSession(); session = data.session; },
    session: () => (session ? { email: session.user.email } : null),
    onAuth: (cb) => listeners.push(cb),
    async signIn(email, pw) { const { error } = await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pw }); fail(error); },
    async canSignUp(email) { const { data, error } = await sb.rpc('can_sign_up', { p_email: email }); fail(error); return data; },
    async signUp(email, pw) {
      const { data, error } = await sb.auth.signUp({ email: email.trim().toLowerCase(), password: pw, options: { emailRedirectTo: location.origin + location.pathname } });
      fail(error);
      return { needsConfirm: !data.session };
    },
    async signOut() { await sb.auth.signOut(); myMember = null; },
    async updatePassword(pw) { const { error } = await sb.auth.updateUser({ password: pw }); fail(error); },
    async resetPassword(email) { const { error } = await sb.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: location.origin + location.pathname }); fail(error); },

    async me() {
      if (!session) return null;
      const { data, error } = await sb.from('members').select('*').eq('user_id', session.user.id).eq('active', true).maybeSingle();
      fail(error);
      myMember = data;
      return data;
    },
    async members() { const { data, error } = await sb.from('members').select('*').order('created_at'); fail(error); return data; },
    async saveMember(m) {
      const email = String(m.email || '').trim().toLowerCase();
      const row = { name: m.name, role: m.role, color: m.color, avatar: m.avatar || null, active: m.active !== false,
        title: m.title || null, department: m.department || null, phone: m.phone || null, sort_order: m.sort_order || 0 };
      let q;
      if (m.id) {
        const { data: cur, error: e1 } = await sb.from('members').select('email').eq('id', m.id).single();
        fail(e1);
        if (cur.email !== email) { const { error: e2 } = await sb.rpc('admin_change_email', { p_member: m.id, p_email: email }); fail(e2, 'E-posta değiştirilemedi'); }
        q = sb.from('members').update(row).eq('id', m.id);
      } else q = sb.from('members').insert({ ...row, email });
      const { data, error } = await q.select().single();
      fail(error, 'Kaydedilemedi');
      return data;
    },
    async setOrder(list) {
      for (const { id, sort_order } of list) { const { error } = await sb.from('members').update({ sort_order }).eq('id', id); fail(error, 'Sıra kaydedilemedi'); }
    },
    async setPassword(memberId, pw) { const { error } = await sb.rpc('admin_set_password', { p_member: memberId, p_password: pw }); fail(error, 'Şifre değiştirilemedi'); },
    async deleteMember(m) {
      const { data: reps, error: e1 } = await sb.from('reports').select('images').eq('member_id', m.id);
      fail(e1);
      const paths = reps.flatMap((r) => r.images || []);
      for (let i = 0; i < paths.length; i += 100) await sb.storage.from(BUCKET).remove(paths.slice(i, i + 100));
      const { error } = await sb.rpc('admin_delete_member', { p_member: m.id }); fail(error, 'Silinemedi');
    },
    async memberNotes() { const { data, error } = await sb.from('member_notes').select('*'); fail(error); return Object.fromEntries(data.map((n) => [n.member_id, n.note])); },
    async saveMemberNote(memberId, note) { const { error } = await sb.from('member_notes').upsert({ member_id: memberId, note, updated_at: new Date().toISOString() }); fail(error, 'Not kaydedilemedi'); },

    async tasks() { const { data, error } = await sb.from('tasks').select('*').order('created_at'); fail(error); return data; },
    async addTasks(rows) { const { data, error } = await sb.from('tasks').insert(rows).select(); fail(error, 'Görev kaydedilemedi'); return data; },
    async updateTask(id, patch) { const { data, error } = await sb.from('tasks').update(patch).eq('id', id).select().single(); fail(error, 'Görev güncellenemedi'); return data; },
    async deleteTask(id) { const { error } = await sb.from('tasks').delete().eq('id', id); fail(error, 'Görev silinemedi'); },
    async checks(since) { const { data, error } = await sb.from('task_checks').select('*').gte('period_key', since); fail(error); return data; },
    async setCheck(taskId, key, done, note = '') {
      if (done) { const { data, error } = await sb.from('task_checks').upsert({ task_id: taskId, period_key: key, note, done_at: new Date().toISOString() }).select().single(); fail(error, 'Kaydedilemedi'); return data; }
      const { error } = await sb.from('task_checks').delete().eq('task_id', taskId).eq('period_key', key); fail(error, 'Kaydedilemedi'); return null;
    },

    async reports() {
      const all = []; const size = 1000;
      for (let from = 0; ; from += size) {
        const { data, error } = await sb.from('reports').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }).range(from, from + size - 1);
        fail(error);
        all.push(...data);
        if (data.length < size) break;
      }
      return all;
    },
    async addReport(r) { const { data, error } = await sb.from('reports').insert(r).select().single(); fail(error, 'Rapor kaydedilemedi'); return data; },
    async updateReport(id, patch) { const { data, error } = await sb.from('reports').update(patch).eq('id', id).select().single(); fail(error, 'Rapor güncellenemedi'); return data; },
    async deleteReport(r) {
      const { error } = await sb.from('reports').delete().eq('id', r.id); fail(error, 'Rapor silinemedi');
      if (r.images && r.images.length) await sb.storage.from(BUCKET).remove(r.images);
    },

    async uploadImage(memberId, blob) {
      const ext = blob.type === 'image/png' ? 'png' : blob.type === 'image/gif' ? 'gif' : blob.type === 'image/webp' ? 'webp' : 'jpg';
      const path = memberId + '/' + U.uid() + '.' + ext;
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || 'image/jpeg', upsert: false });
      fail(error, 'Görsel yüklenemedi');
      return path;
    },
    async imageUrls(paths) {
      const out = {};
      if (!paths.length) return out;
      for (let i = 0; i < paths.length; i += 100) {
        const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(paths.slice(i, i + 100), 60 * 60 * 6);
        fail(error);
        data.forEach((d) => { if (d.signedUrl) out[d.path] = d.signedUrl; });
      }
      return out;
    },
    async imageDataUrl(path) {
      const { data, error } = await sb.storage.from(BUCKET).download(path);
      fail(error);
      return U.readAsDataURL(data);
    },
    async removeImages(paths) { if (paths.length) await sb.storage.from(BUCKET).remove(paths); },

    async notes() { const { data, error } = await sb.from('team_notes').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }); fail(error); return data; },
    async addNote(n) { const { data, error } = await sb.from('team_notes').insert(n).select().single(); fail(error, 'Not kaydedilemedi'); return data; },
    async deleteNote(id) { const { error } = await sb.from('team_notes').delete().eq('id', id); fail(error, 'Not silinemedi'); },

    async getSetting(key) { const { data, error } = await sb.from('settings').select('value').eq('key', key).maybeSingle(); fail(error); return data ? data.value : null; },
    async setSetting(key, value) { const { error } = await sb.from('settings').upsert({ key, value, updated_at: new Date().toISOString() }); fail(error, 'Ayar kaydedilemedi'); },
  };
};

</script>
<script>
// js/ai.js
// Google Gemini ile analiz, haftalık değerlendirme ve asistan komutları
const AI = (() => {
  const DEFAULT_MODEL = 'gemini-flash-latest';

  // Yoğunluk/geçici hatalarda önce aynı modeli yeniden dener, sonra yedek modellere geçer
  const FALLBACKS = ['gemini-flash-latest', 'gemini-flash-lite-latest', 'gemini-2.5-flash'];
  const TRANSIENT = new Set([429, 500, 502, 503, 504]);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  class GeminiError extends Error { constructor(msg, { transient = false, notFound = false } = {}) { super(msg); this.transient = transient; this.notFound = notFound; } }

  async function once({ apiKey, model, body }) {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent';
    let res;
    try {
      res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey }, body: JSON.stringify(body) });
    } catch (e) { throw new GeminiError('Gemini\'ye ulaşılamadı. İnternet bağlantını kontrol et.', { transient: true }); }
    let data = null;
    try { data = await res.json(); } catch { /* boş yanıt */ }
    if (!res.ok || (data && data.error)) {
      const msg = (data && data.error && data.error.message) || ('HTTP ' + res.status);
      const status = res.ok ? (data.error.code || 500) : res.status;
      if (status === 404) throw new GeminiError('"' + model + '" modeli bulunamadı.', { notFound: true });
      if (status === 400 && /API key/i.test(msg)) throw new GeminiError('Gemini API anahtarı geçersiz. Ayarlar > Yapay zekâ bölümünden kontrol et.');
      if (status === 429 && /quota|exhausted|limit/i.test(msg) && !/high demand|overloaded/i.test(msg)) throw new GeminiError('Gemini\'nin ücretsiz kullanım sınırı doldu. Biraz bekleyip tekrar dene.', { transient: true });
      if (TRANSIENT.has(status) || /high demand|overloaded|unavailable|try again/i.test(msg)) throw new GeminiError('Gemini şu an çok yoğun.', { transient: true });
      throw new GeminiError('Gemini hatası: ' + msg);
    }
    const cand = data && data.candidates && data.candidates[0];
    const out = cand && cand.content && cand.content.parts ? cand.content.parts.filter((p) => !p.thought).map((p) => p.text || '').join('\n').trim() : '';
    if (!out) {
      if (cand && cand.finishReason === 'MAX_TOKENS') throw new GeminiError('Yanıt çok uzun oldu ve kesildi. Tarih aralığını daraltıp tekrar dene.');
      if (cand && cand.finishReason === 'SAFETY') throw new GeminiError('Gemini bu isteğe yanıt vermedi (güvenlik filtresi).');
      throw new GeminiError('Gemini boş yanıt döndürdü.', { transient: true });
    }
    return out;
  }

  async function call({ apiKey, model, system, text, images = [], maxTokens = 8192, json = false, onRetry }) {
    if (!apiKey) throw new Error('Gemini API anahtarı girilmemiş. Ayarlar > Yapay zekâ bölümünden ekle.');
    const parts = [{ text }];
    images.forEach((img) => parts.push({ inline_data: { mime_type: img.mimeType, data: img.data } }));
    const body = {
      system_instruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts }],
      generationConfig: { maxOutputTokens: maxTokens, ...(json ? { responseMimeType: 'application/json' } : {}) },
    };
    const first = (model || DEFAULT_MODEL).trim();
    const models = [first, ...FALLBACKS.filter((m) => m !== first)];
    let last = null;
    for (let mi = 0; mi < models.length; mi++) {
      const tries = mi === 0 ? 3 : 2;
      for (let t = 0; t < tries; t++) {
        try { return await once({ apiKey, model: models[mi], body }); }
        catch (e) {
          last = e;
          if (e.notFound) break;            // bu model yok: sıradakine geç
          if (!e.transient) throw e;        // kalıcı hata: hemen bildir
          if (t < tries - 1) { onRetry && onRetry(models[mi], t + 1); await wait(1500 * Math.pow(2, t) + Math.random() * 500); }
        }
      }
      if (mi < models.length - 1) onRetry && onRetry(models[mi + 1], 0);
    }
    if (last && last.notFound) throw new Error('Gemini modeli bulunamadı. Ayarlar > Yapay zekâ bölümünde model adını "' + DEFAULT_MODEL + '" yap.');
    throw new Error((last ? last.message + ' ' : '') + 'Birkaç kez ve yedek modellerle denendi ama yanıt alınamadı. Birkaç dakika sonra tekrar dene.');
  }

  const inRange = (d, from, to) => (!from || d >= from) && (!to || d <= to);

  // Kayıtları Gemini'ye gidecek biçime çevirir; görseller id ile eşleştirilir
  async function promptData(state, from, to, { withImages = true, maxImages = 12, onlyImportant = false } = {}) {
    let ref = 1; const idToPath = {}; const imageParts = []; const allData = {};
    for (const emp of state.employees) {
      let recs = state.reports.filter((r) => r.member_id === emp.id && inRange(r.date, from, to)).sort((a, b) => a.date.localeCompare(b.date));
      if (onlyImportant) recs = recs.filter((r) => r.important);
      if (!recs.length) continue;
      allData[emp.name] = [];
      for (const r of recs) {
        const id = 'R' + ref++;
        const ids = [];
        for (let i = 0; i < (r.images || []).length; i++) {
          const sub = id + '-' + i; idToPath[sub] = r.images[i]; ids.push(sub);
          if (withImages && imageParts.length < maxImages) {
            try {
              const du = await API.imageDataUrl(r.images[i]);
              const m = /^data:([^;]+);base64,(.+)$/.exec(du);
              if (m) imageParts.push({ mimeType: m[1], data: m[2] });
            } catch { /* görsel okunamadıysa atla */ }
          }
        }
        allData[emp.name].push({ id, date: r.date, gun: U.weekday(r.date), tur: r.type, raw_text: r.raw_text, important: !!r.important, image_ids: ids, links: r.links || [] });
      }
    }
    return { allData, idToPath, imageParts };
  }

  const ASK_SYSTEM = `Sen bir çalışan rapor kayıtları analiz asistanısın. Sana JSON formatında çalışanların tarih damgalı rapor kayıtları verilecek. Her kaydın "id", "date", "gun", "tur", "raw_text", "important", "image_ids" ve "links" alanları var. "tur": "gunluk" (günlük not), "hazir" (tamamlanmış iş), "gelecek_hafta" (gelecek hafta planı).
Bazı kayıtların görselleri ayrıca resim olarak da gönderildi (image_ids sırasıyla).
KURAL 1 - GÖRSEL: Cevabında görseli olan bir kayda değiniyorsan, ilgili cümleden hemen sonra YENİ SATIRDA her görsel için [[IMG:R3-0]] biçiminde bir işaret koy.
KURAL 2 - BAĞLANTI: Bir kaydın bağlantısına değiniyorsan URL'yi olduğu gibi tam yaz.
Kullanıcı "önemli notları özetle" derse SADECE "important": true olan kayıtları kullan.
SADECE verilen kayıtlara dayan, uydurma; bilgi yoksa "bu bilgi kayıtlarda yok" de. Kısa, net, Türkçe cevap ver. Markdown yıldız ya da kalın yazı kullanma.`;

  const WEEKLY_SYSTEM = `Sen bir ekip yöneticisi için haftalık değerlendirme raporu yazan bir asistansın. Sana JSON formatında iki şey verilecek:
1) "calisanlar": çalışan isimlerine göre gruplanmış, her birinin o dönemdeki mesajları. Her mesajın "tarih", "gun", "mesaj" ve "tur" alanı var. "tur": "gunluk" (normal günlük çalışma notu), "hazir" (tamamlanmış/hazır iş; bunu "tamamladı", "hazırladı", "bitirdi" gibi ifadelerle vurgula), "gelecek_hafta" (çalışanın gelecek hafta yapacağı iş; bunu SADECE "GELECEK HAFTA EKİBİN ÇALIŞACAĞI ALANLAR" bölümünde kullan).
2) "ekip": "toplantilar" (toplantı notları, tarih+gün+metin) ve "gelecek_hafta_etkinlikleri" (ekibin geneline ait gelecek hafta planları).
3) "gorevler": çalışanlara verilen görevler ve durumları ("tamamlandı" / "tamamlanmadı", varsa çalışanın notu).

GÖREV: Aşağıdaki şablona TAM uyan, DETAYLI ve AÇIKLAYICI bir "Haftalık Ekip Değerlendirmesi" yaz. Her madde tam bir cümle olsun; ne yapıldığını, hangi kararın alındığını, sonucun ne olduğunu açıkça anlat.

HAFTALIK EKİP DEĞERLENDİRMESİ

📅 <GÜN ADI>

<Çalışan Adı>
- <o gün yaptığı işi ayrıntılı, tam cümle halinde anlatan madde>

(O güne ait toplantı varsa, o günün altına "Ekip Çalışması" başlığı aç ve toplantı notunu ayrıntılı yaz. Birden fazla çalışanın ortak konusu varsa da bu başlığı kullanabilirsin.)

Günleri kronolojik sırayla yaz ve aralarına "---" koy. Kaydı olmayan günü hiç yazma.

Rapor sonunda (SADECE ilgili veri varsa):

📋 GÖREV DURUMU
<Çalışan Adı>: <tamamlanan sayısı>/<toplam> görev tamamlandı.
- Tamamlanmayanlar: <görev adları, varsa>

📌 GELECEK HAFTA YAPILACAK ETKİNLİKLER
- <madde>

📌 GELECEK HAFTA EKİBİN ÇALIŞACAĞI ALANLAR

<Çalışan Adı>
- <"tur":"gelecek_hafta" mesajlarından üretilmiş madde>

KURALLAR:
- Mesajları olduğu gibi kopyalama, kendi cümlelerinle net madde haline getir.
- SADECE verilen verilere dayan, asla bilgi uydurma.
- "hazir" mesajlarda işin tamamlandığını açıkça belirt.
- "gelecek_hafta" mesajlarını günlük bölümde ASLA kullanma.
- O gün kaydı olmayan çalışanın adını o günün altına yazma.
- Türkçe, düz metin yaz (markdown yıldız/kalın kullanma), başlık ve emoji biçimine sadık kal.`;

  function weeklyData(state, from, to) {
    const calisanlar = {};
    state.employees.forEach((emp) => {
      const recs = state.reports.filter((r) => r.member_id === emp.id && inRange(r.date, from, to)).sort((a, b) => a.date.localeCompare(b.date));
      if (recs.length) calisanlar[emp.name] = recs.map((r) => ({ tarih: r.date, gun: U.weekday(r.date), mesaj: r.raw_text || '', tur: r.type || 'gunluk' }));
    });
    const notes = state.notes.filter((n) => inRange(n.date, from, to));
    const ekip = {
      toplantilar: notes.filter((n) => n.type === 'toplanti').map((n) => ({ tarih: n.date, gun: U.weekday(n.date), metin: n.text })),
      gelecek_hafta_etkinlikleri: notes.filter((n) => n.type === 'etkinlik').map((n) => ({ tarih: n.date, metin: n.text })),
    };
    // Görev durumu: dönemle kesişen her günlük/haftalık/aylık görev dönemi
    const gorevler = {};
    if (typeof Tasks !== 'undefined' && from && to) {
      state.employees.forEach((emp) => {
        const out = [];
        for (const p of ['gunluk', 'haftalik', 'aylik']) {
          for (let k = Tasks.keyOf(p, from); k <= to; k = Tasks.shift(p, k, 1)) {
            Tasks.forMember(emp.id, p, k).forEach((t) => {
              const c = Tasks.checkOf(t, k);
              out.push({ gorev: t.title, donem: Tasks.PERIODS[p].label + ' (' + Tasks.label(p, k) + ')', durum: c ? 'tamamlandı' : 'tamamlanmadı', not: c && c.note ? c.note : undefined });
            });
          }
        }
        if (out.length) gorevler[emp.name] = out;
      });
    }
    const empty = !Object.keys(calisanlar).length && !ekip.toplantilar.length && !ekip.gelecek_hafta_etkinlikleri.length && !Object.keys(gorevler).length;
    return { calisanlar, ekip, gorevler, empty };
  }

  const assistantSystem = (names) => `Sen bir rapor defteri uygulamasının asistanısın (Türkçe konuşuyorsun). Kullanıcının sesli/yazılı komutunu al ve SADECE aşağıdaki JSON nesnelerinden birini döndür:
{"action":"add_record","employee":"<isim>","text":"<mesaj>","type":"gunluk|hazir|gelecek_hafta","link":null,"important":false}
{"action":"mark_important_latest","employee":"<isim>"}
{"action":"open_employee","employee":"<isim>"}
{"action":"search_summary","query":"<soru>"}
{"action":"speak","text":"<doğal Türkçe cevap>"}
Geçerli çalışan isimleri: ${names.join(', ')}.
"X için not/kayıt ekle" → add_record. Bir çalışanın sayfasını açmak → open_employee. Geçmiş kayıtlar hakkında soru → search_summary. Net bir eylem değilse → speak.
SADECE JSON döndür.`;

  function extractJson(text) {
    const s = text.indexOf('{'), e = text.lastIndexOf('}');
    if (s < 0 || e < s) return null;
    try { return JSON.parse(text.slice(s, e + 1)); } catch { return null; }
  }

  return { DEFAULT_MODEL, call, promptData, weeklyData, ASK_SYSTEM, WEEKLY_SYSTEM, assistantSystem, extractJson, inRange };
})();

</script>
<script>
// js/export.js
// Excel yedeği ve PDF (yazdır) çıktıları
const Export = (() => {
  const EXCELJS = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
  const TYPE = { gunluk: 'Günlük not', hazir: 'Tamamlanan iş', gelecek_hafta: 'Gelecek hafta planı' };

  async function excel(state, { from, to, title, fileName, onProgress }) {
    await U.loadScript(EXCELJS);
    const wb = new window.ExcelJS.Workbook();
    wb.creator = 'Rapor Defteri';
    const ws = wb.addWorksheet('Raporlar', { views: [{ state: 'frozen', ySplit: 3 }] });
    ws.columns = [{ width: 12 }, { width: 11 }, { width: 18 }, { width: 18 }, { width: 60 }, { width: 9 }, { width: 34 }, { width: 40 }];
    ws.mergeCells('A1:H1');
    ws.getCell('A1').value = title;
    ws.getCell('A1').font = { bold: true, size: 13 };
    const head = ['Tarih', 'Gün', 'Çalışan', 'Tür', 'Mesaj', 'Önemli', 'Bağlantılar', 'Görseller'];
    head.forEach((t, i) => { const c = ws.getCell(3, i + 1); c.value = t; c.font = { bold: true }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8EDF7' } }; });

    const byId = Object.fromEntries(state.members.map((m) => [m.id, m]));
    const recs = state.reports.filter((r) => AI.inRange(r.date, from, to)).sort((a, b) => a.date.localeCompare(b.date) || (byId[a.member_id]?.name || '').localeCompare(byId[b.member_id]?.name || '', 'tr'));
    let row = 4, imgCount = 0;
    for (let k = 0; k < recs.length; k++) {
      const r = recs[k];
      onProgress && onProgress(k + 1, recs.length);
      const x = ws.getRow(row);
      x.getCell(1).value = U.shortDate(r.date);
      x.getCell(2).value = U.weekday(r.date);
      x.getCell(3).value = byId[r.member_id]?.name || '—';
      x.getCell(4).value = TYPE[r.type] || r.type;
      x.getCell(5).value = r.raw_text || '';
      x.getCell(6).value = r.important ? 'Evet' : '';
      const links = r.links || [];
      if (links.length === 1) { x.getCell(7).value = { text: links[0], hyperlink: links[0] }; x.getCell(7).font = { color: { argb: 'FF2B4ACB' }, underline: true }; }
      else if (links.length > 1) x.getCell(7).value = links.join('\n');
      [5, 7].forEach((c) => { x.getCell(c).alignment = { wrapText: true, vertical: 'top' }; });
      [1, 2, 3, 4, 6].forEach((c) => { x.getCell(c).alignment = { vertical: 'top' }; });
      const imgs = (r.images || []).slice(0, 4);
      for (let i = 0; i < imgs.length; i++) {
        try {
          const du = await API.imageDataUrl(imgs[i]);
          const m = /^data:image\/([a-z0-9.+-]+);base64,/i.exec(du);
          let ext = m ? m[1].toLowerCase() : 'jpeg'; if (ext === 'jpg') ext = 'jpeg'; if (!['png', 'jpeg', 'gif'].includes(ext)) ext = 'jpeg';
          const id = wb.addImage({ base64: du, extension: ext });
          ws.addImage(id, { tl: { col: 7 + i * 0.25, row: row - 1 + 0.1 }, ext: { width: 66, height: 66 } });
          imgCount++;
        } catch { /* görsel atlanır */ }
      }
      if ((r.images || []).length > 4) x.getCell(8).value = '+' + (r.images.length - 4) + ' görsel daha';
      x.height = imgs.length ? 56 : Math.min(120, 16 * Math.max(1, Math.ceil((r.raw_text || '').length / 70)));
      row++;
    }
    const buf = await wb.xlsx.writeBuffer();
    U.download(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fileName + '.xlsx');
    return { count: recs.length, imgCount };
  }

  // Tarayıcının yazdırma penceresini açar; oradan "PDF olarak kaydet" seçilir
  function printPdf(title, bodyNode) {
    const frame = U.h('iframe', { style: { position: 'fixed', right: '0', bottom: '0', width: '0', height: '0', border: '0' }, 'aria-hidden': 'true' });
    document.body.appendChild(frame);
    const doc = frame.contentDocument;
    doc.open();
    doc.write(`<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>${U.esc(title)}</title><style>
      @page{size:A4;margin:18mm 16mm}
      body{font-family:"Schibsted Grotesk",Arial,sans-serif;color:#1C2430;font-size:12.5px;line-height:1.65}
      h1{font-size:19px;margin:0 0 4px;font-weight:700}
      .meta{color:#6B7380;font-size:11px;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #1C2430}
      .out{white-space:pre-wrap}
      .out img{max-width:240px;max-height:240px;border-radius:4px;margin:6px 0;display:block;page-break-inside:avoid}
      a{color:#2B4ACB}
    </style></head><body><h1>${U.esc(title)}</h1><div class="meta">Oluşturulma: ${new Date().toLocaleString('tr-TR')}</div><div class="out"></div></body></html>`);
    doc.close();
    doc.querySelector('.out').appendChild(doc.importNode(bodyNode, true));
    const imgs = [...doc.images];
    Promise.all(imgs.map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; })))).then(() => {
      frame.contentWindow.focus();
      frame.contentWindow.print();
      setTimeout(() => frame.remove(), 60000);
    });
  }

  function json(state) {
    const byId = Object.fromEntries(state.members.map((m) => [m.id, m.name]));
    const data = {
      olusturulma: new Date().toISOString(),
      uyeler: state.members.map(({ name, email, role, active }) => ({ name, email, role, active })),
      raporlar: state.reports.map((r) => ({ calisan: byId[r.member_id], tarih: r.date, tur: r.type, mesaj: r.raw_text, onemli: r.important, baglantilar: r.links, gorsel_sayisi: (r.images || []).length })),
      ekip_notlari: state.notes.map((n) => ({ tarih: n.date, tur: n.type, metin: n.text })),
    };
    U.download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'rapor-defteri-yedek-' + U.today() + '.json');
  }

  return { excel, printPdf, json, TYPE };
})();
